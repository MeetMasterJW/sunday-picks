<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunday Picks">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<title>Sunday Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Saira+Condensed:wght@600;700&family=Unbounded:wght@600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=6d5efabe">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="topbar">
      <span class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#E23F17"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#markGrad)"/><path d="M9.5 16.5l4.3 4.3 8.7-9.3" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sunday Picks</span></span>
      <button type="button" class="me-btn" id="meBtn" aria-label="Open your profile"><span class="jersey" id="meFace"></span></button>
    </div>
    <div class="weeknav">
      <div class="wk"><b id="wkTitle">Week –</b><span id="wkDates">Loading schedule…</span></div>
      <div class="weekstrip" id="weekStrip" role="tablist" aria-label="Week"></div>
    </div>
  </div>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="picks" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>Picks</span></button>
  <button role="tab" data-tab="all" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>All picks</span></button>
  <button role="tab" data-tab="standings" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h8M12 16v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4.5a2.5 2.5 0 002.8 3.6M17 6h2.5a2.5 2.5 0 01-2.8 3.6"/></svg><span>Standings</span></button>
  <button role="tab" data-tab="family" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M3 19.5a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.4"/><path d="M16.2 14a4.6 4.6 0 015.3 5.5"/></svg><span>Family</span></button>
</nav>
<div class="alert" id="alert" role="status" aria-live="polite" hidden></div>
<dialog id="boxDlg" class="sheet" aria-labelledby="boxTitle">
  <div class="box-head"><h3 id="boxTitle">Box score</h3><button type="button" class="box-close" data-box-close aria-label="Close box score"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="boxBody"></div>
</dialog>
<dialog id="profDlg" class="sheet" aria-labelledby="profTitle">
  <div class="box-head"><h3 id="profTitle">Profile</h3><button type="button" class="box-close" data-prof-close aria-label="Close profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="profBody"></div>
</dialog>
<dialog id="pinDlg" class="pin" aria-labelledby="pinTitle">
  <span class="jersey" id="pinFace"></span>
  <h3 id="pinTitle">PIN</h3>
  <p class="muted" id="pinWhy"></p>
  <div class="pin-dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="err" id="pinErr" role="alert" hidden></p>
  <div class="pin-pad">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
    <button type="button" class="pin-alt" data-key="cancel">Cancel</button><button type="button" data-key="0">0</button><button type="button" class="pin-alt" data-key="back" aria-label="Delete last digit">⌫</button>
  </div>
  <p class="muted pin-forgot" id="pinForgot">Forgot it? A parent can reset it from the profile.</p>
</dialog>
<div class="unlock" id="unlock" role="status" aria-live="polite" hidden></div>
<div class="toast" id="toast" hidden></div>
<dialog id="parentDlg" aria-labelledby="parentTitle">
  <form id="parentForm">
    <h3 id="parentTitle">Parent password</h3>
    <p class="muted" id="parentWhy"></p>
    <input type="email" id="parentUser" autocomplete="username" hidden>
    <input type="password" id="parentPw" autocomplete="current-password" aria-label="Parent password" required>
    <label class="keep"><input type="checkbox" id="parentKeep"> Keep a parent signed in on this device</label>
    <p class="err" id="parentErr" hidden></p>
    <div class="dlgbtns"><button type="button" class="toggle" id="parentCancel">Cancel</button><button type="submit" class="primary" id="parentGo">Continue</button></div>
  </form>
</dialog>

<script type="module" src="app.js?v=6d5efabe"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunday Picks">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<title>Sunday Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Saira+Condensed:wght@600;700&family=Unbounded:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#0A0C0F;--surface:#14171C;--raised:#1C2027;--line:#242933;--line-2:#323946;
  --ink:#F4F6F8;--ink-2:#A8B0BC;--ink-3:#6E7785;
  --accent:#FF6A2B;--good:#30D158;--bad:#FF453A;--live:#FF453A;
  --radius:18px;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Unbounded","Figtree",system-ui,sans-serif;
  --numeric:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(900px 420px at 50% -180px,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%) no-repeat,var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(10,12,15,.8);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;display:grid;gap:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 2px}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-.015em;color:var(--ink)}
.brand .mark{width:28px;height:28px;flex:none;filter:drop-shadow(0 4px 10px rgba(255,106,43,.35))}
.me-btn{border:0;background:none;padding:3px;border-radius:50%;display:grid;place-items:center}
.me-btn .jersey{width:32px;height:32px;font-size:14px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--line-2)}
.me-btn.unlocked .jersey{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--good)}
.linkbtn.sm{font-size:12.5px;padding:0 0 0 6px}
.linkbtn.quiet{color:var(--ink-3);font-weight:600}
.weeknav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.nav{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.nav:disabled{opacity:.25;cursor:default}
.nav svg,.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wk{text-align:center;line-height:1.15}
.wk b{display:block;font-family:var(--display);font-size:19px;font-weight:700;margin-top:3px}
.wk span{font-size:12.5px;color:var(--ink-2)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(14,16,20,.86);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px}
.tabs button[aria-selected="true"]{color:var(--accent)}
@media (min-width:760px){
  .tabs{left:50%;right:auto;width:480px;transform:translateX(-50%);bottom:16px;border:1px solid var(--line);border-radius:22px;padding:6px}
  body{padding-bottom:110px}
}

main{max-width:760px;margin:0 auto;padding:14px 12px 24px;display:grid;gap:12px}
main>*{min-width:0}
.eyebrow{margin:0;font-size:13px;font-weight:700;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:14px;margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--raised);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px}
.empty{text-align:center;padding:48px 12px;color:var(--ink-2)}
.jersey{border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:800;width:34px;height:34px;font-size:15px;flex:none}

/* whose picks are shown */
.viewer{display:grid;gap:8px}
.viewer-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px;font-size:14px;color:var(--ink-2)}
.viewer-head b{color:var(--ink);font-weight:800}
.viewer-sum{font-size:14px;font-weight:600;color:var(--ink-2)}
.viewer-sum .num{font-family:var(--numeric);font-size:20px;font-weight:700;color:var(--ink)}
.pickers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pk{display:grid;justify-items:center;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 2px 7px;min-width:0}
.pk .jersey{width:34px;height:34px;font-size:15px}
.pk .nm{max-width:100%;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .ct{font-family:var(--numeric);font-size:14px;font-weight:600;color:var(--ink-3);line-height:1}
.pk[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.pk[aria-pressed="true"] .nm{color:var(--ink);font-weight:800}
.pk[aria-pressed="true"] .ct{color:var(--ink)}
.pk[aria-pressed="true"] .jersey{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.note,.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;color:var(--ink-2)}
.note b{color:var(--ink)}
.lockbar{flex-wrap:nowrap;padding-left:8px}
.lockbar .lb-text{flex:1}
.lockbar .toggle,.note .toggle{padding:6px 12px}
.pill{font-size:11px;font-weight:700;background:var(--raised);color:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px}

/* games */
.day{display:grid;gap:10px}
.dayhead{margin:8px 4px 0}
.dayhead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.slot{font-size:10px;font-weight:800;background:var(--accent);color:#fff;border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px 8px;display:grid;gap:6px}
.game.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}}
.gmeta{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;padding:2px 6px 0;font-size:12.5px;color:var(--ink-3)}
.gmeta .line{font-weight:600;color:var(--ink-2)}
.st{font-weight:600;color:var(--ink-2)}
.st.final{color:var(--ink)}
.st.live{color:var(--live)}
.st.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px 1px currentColor;margin-right:6px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.rows{display:grid;gap:4px}
.team{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:var(--raised);border-radius:14px;padding:8px 12px 8px 8px;min-height:58px}
.team .logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 75%,transparent) 0,color-mix(in srgb,var(--tc) 30%,transparent) 55%,transparent 71%)}
.team .logo img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.team .logo .ab{font-weight:800;font-size:12px}
.tn{min-width:0;display:grid}
.tn b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.tag{font-style:normal;font-weight:700}
.up .tag,.ok .tag{color:var(--good)}
.down .tag,.no .tag{color:var(--bad)}
.even .tag{color:var(--ink-2)}
.sc{font-family:var(--numeric);font-size:34px;font-weight:700;min-width:1.6ch;text-align:right;color:var(--ink-3);line-height:1}
.team.ahead .sc,.team.won .sc{color:var(--ink)}
.team.lost .tn b,.team.behind .tn b{color:var(--ink-2)}
.team.lost .logo{opacity:.5}
.sc.bump{animation:bump 1.4s ease-out}
@keyframes bump{0%{transform:scale(1.45);color:var(--accent)}55%{transform:scale(1);color:var(--accent)}}
.pickmark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.team.mine .pickmark{border-color:var(--me);background:var(--me)}
.team.mine .pickmark::after{content:"✓";color:#fff;font-size:13px;font-weight:800;line-height:1}
.team.mine{border-color:color-mix(in srgb,var(--me) 75%,transparent);background:color-mix(in srgb,var(--me) 16%,var(--raised))}
.team.mine.up,.team.mine.ok{border-color:color-mix(in srgb,var(--good) 70%,transparent);background:color-mix(in srgb,var(--good) 13%,var(--raised));box-shadow:0 0 24px -12px color-mix(in srgb,var(--good) 90%,transparent)}
.team.mine.down,.team.mine.no{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--raised))}
.team[aria-disabled="true"]{cursor:default}
.pips{display:flex;align-items:center}
.pip{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;box-shadow:0 0 0 2px var(--raised)}
.pips{gap:3px}
.pip.up,.pip.ok{box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px var(--good),0 0 10px 1px color-mix(in srgb,var(--good) 55%,transparent)}
.pip.down{box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px var(--bad)}
.pip.no{opacity:.4}
.sealed{margin:0 6px 2px;font-size:12px;color:var(--ink-3)}
.tb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:2px;padding:10px 6px 4px;font-size:14px;color:var(--ink-2)}
.tb b{color:var(--ink)}
.tb input{width:84px;font:700 26px var(--numeric);text-align:center;padding:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
.tb input:focus{outline:none;border-color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.guess{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
@media (hover:hover){.team:not([aria-disabled="true"]):hover,.pk:hover{border-color:var(--line-2)}}
@media (prefers-reduced-motion:no-preference){.team,.pk{transition:background-color .15s,border-color .15s,transform .1s}.team:active:not([aria-disabled="true"]),.pk:active{transform:scale(.985)}}

/* tables */
.scroll{overflow-x:auto;margin:10px -14px -14px;padding:0 14px 12px}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{padding:9px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--ink-3)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.win{color:var(--accent);font-weight:800}
td.tot{font-family:var(--numeric);font-weight:700;font-size:21px}
.rk{display:inline-block;min-width:14px;color:var(--ink-3);font-weight:700}
.pcell{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.pcell .jersey.mini{margin:0;vertical-align:0}
.allpicks th{vertical-align:top;min-width:64px}
.allpicks th:first-child{vertical-align:bottom}
.allpicks th small{display:block;font-size:12px;color:var(--ink-2)}
.allpicks .jersey{width:28px;height:28px;font-size:13px;margin:0 auto 4px;display:grid}
.gcell b{display:block;font-weight:700;font-family:var(--numeric);font-size:16px;letter-spacing:.02em}
.gcell span{display:block;font-size:12px;color:var(--ink-3)}
.pchip{display:inline-block;min-width:44px;padding:3px 6px;border-radius:8px;background:var(--tc);color:var(--tx);font-family:var(--numeric);font-size:15px;font-weight:700;letter-spacing:.02em}
td.ok{background:color-mix(in srgb,var(--good) 16%,transparent)}
td.up{background:color-mix(in srgb,var(--good) 8%,transparent)}
td.down{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.plogo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 70%,transparent) 0,color-mix(in srgb,var(--tc) 25%,transparent) 58%,transparent 72%);transition:box-shadow .3s,opacity .3s}
.plogo img{width:26px;height:26px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.plogo b{font-family:var(--numeric);font-size:13px;font-weight:700}
td.no .plogo{opacity:.35;filter:grayscale(.6)}
td.ok .plogo{box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 55%,transparent),0 0 14px -3px color-mix(in srgb,var(--good) 70%,transparent)}
td.up .plogo{animation:chipGlow 2.4s ease-in-out infinite}
@keyframes chipGlow{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 35%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 65%,transparent),0 0 16px -2px color-mix(in srgb,var(--good) 75%,transparent)}}
.allpicks th.lead .jersey{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--c),0 0 18px 2px color-mix(in srgb,var(--c) 70%,transparent)}
.mark{font-style:normal;font-weight:800;margin-left:4px;font-size:11px}
td.ok .mark,td.up .mark{color:var(--good)}
td.no .mark,td.down .mark{color:var(--bad)}
td.none,td.sealedc{color:var(--ink-3)}
.tbrow td{border-top:1px solid var(--line-2);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:12px;font-weight:600}
.lg.ok,.lg.up{color:var(--good)}
.lg.no,.lg.down{color:var(--bad)}
.upct{color:var(--good)}

/* standings */
.champ{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 28%,var(--surface)),var(--surface) 72%);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center}
.trophy{font-size:34px;color:var(--accent);line-height:1}
.champ h3{margin:4px 0 0;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25;text-wrap:balance}
.champ .eyebrow{color:var(--ink-2)!important;opacity:1!important}
.podium{display:flex;flex-wrap:wrap;gap:2px 14px;margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.podium b{color:var(--accent)}
.rank{position:relative;display:grid;gap:6px;margin-top:10px}
.rank canvas.sparks{position:absolute;inset:0;z-index:3;pointer-events:none}
@property --p{syntax:'<percentage>';inherits:true;initial-value:0%}
.rrow{display:grid;grid-template-columns:20px 34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px 10px 8px;border-radius:14px;background:var(--raised)}
.rrow{position:relative;overflow:hidden}
.rrow>*{position:relative;z-index:1}
@property --f{syntax:'<percentage>';inherits:true;initial-value:0%}
.rrow.has-chance{--f:var(--p);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,var(--raised)) 0,color-mix(in srgb,var(--c) 44%,var(--raised)) var(--f),var(--raised) var(--f))}
.rrow.filling{animation:fillUp var(--dur,1s) cubic-bezier(.2,.8,.2,1) var(--delay,0s) both}
@keyframes fillUp{from{--f:var(--p0)}to{--f:var(--p)}}
.rrow.has-chance::after{content:"";position:absolute;top:0;bottom:0;left:calc(var(--f) - 2px);width:2px;background:color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 0 calc(6px + 14px*var(--g,0)) calc(1px + 3px*var(--g,0)) color-mix(in srgb,var(--c) 80%,transparent);opacity:var(--edge,0);pointer-events:none}
.rrow.lead{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent),0 10px 30px -14px color-mix(in srgb,var(--c) 90%,transparent)}
.rrow.lead .chance b{text-shadow:0 0 16px color-mix(in srgb,var(--c) 90%,transparent)}
@media (prefers-reduced-motion:reduce){.rrow.filling{animation:none}.rank canvas.sparks{display:none}}
.pos{font-weight:800;color:var(--ink-2);text-align:center}
.who>b{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:16px}
.who span{display:block;font-size:12.5px;color:var(--ink-3);min-height:1.4em}
.rec{font-family:var(--numeric);font-size:32px;font-weight:700;text-align:right;line-height:1}
.rec small{display:block;font-family:var(--font);font-size:11px;font-weight:600;color:var(--ink-3);margin-top:3px}
.ptsb{color:var(--accent);font-weight:800;font-size:12px}
button.gmeta{width:100%;border:0;background:none;text-align:left;cursor:pointer;border-radius:10px;padding:4px 6px 2px}
.gmeta .line{display:inline-flex;align-items:center;gap:2px}
.chev{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
@media (hover:hover){button.gmeta:hover .line{color:var(--ink)}}
dialog.sheet{padding:0;width:100%;max-width:560px;max-height:min(90vh,880px);margin:auto auto 0;border:1px solid var(--line-2);border-bottom:0;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column}
@media (min-width:640px){dialog.sheet{margin:auto;border-bottom:1px solid var(--line-2);border-radius:24px}}
@media (prefers-reduced-motion:no-preference){dialog.sheet[open]{animation:sheetIn .28s cubic-bezier(.2,.9,.3,1)}}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}}
.box-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line)}
.box-head h3{margin:0;flex:1;font-family:var(--display);font-size:14px;font-weight:700;line-height:1.3}
.box-close{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;color:var(--ink)}
.box-close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
#boxBody,#profBody{overflow-y:auto;overscroll-behavior:contain;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:18px}
.bx-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px}
.bx-team{display:grid;justify-items:center;gap:3px;text-align:center;min-width:0}
.bx-team .logo{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 75%,transparent) 0,color-mix(in srgb,var(--tc) 30%,transparent) 55%,transparent 71%)}
.bx-team .logo img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.bx-team b{font-size:15px;font-weight:700}
.bx-team small{font-size:12px;color:var(--ink-3)}
.bx-team .pips{justify-content:center;min-height:26px;margin-top:4px}
.bx-mid{display:grid;justify-items:center;gap:6px;padding-top:8px}
.bx-nums{display:flex;align-items:baseline;gap:6px;font-family:var(--numeric);font-size:48px;font-weight:700;line-height:1}
.bx-nums .lo,.bx-nums .dash{color:var(--ink-3)}
.bx-nums .dash{font-size:26px}
.bx-at{font-family:var(--numeric);font-size:30px;color:var(--ink-3);padding:6px 0}
.bx-mid .st{font-size:12.5px;text-align:center;white-space:nowrap}
.bx-sec h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.bx-lines{width:100%;font-size:15px}
.bx-lines th,.bx-lines td{padding:7px 4px;text-align:center}
.bx-lines th:first-child,.bx-lines td:first-child{text-align:left;font-weight:700}
.bx-lines td.tot{font-family:var(--numeric);font-size:19px}
.bx-plays{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.bx-plays li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:start}
.bx-q{grid-column:1/-1;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.bx-type{margin-top:1px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--tc) 70%,#000);color:#fff;font-size:10.5px;font-weight:800}
.bx-text{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:1.35}
.bx-text img{width:18px;height:18px;flex:none;object-fit:contain;margin-top:1px}
.bx-run{font-family:var(--numeric);font-size:18px;font-weight:700;color:var(--ink-2)}
.bx-cols{display:grid;grid-template-columns:1fr 1.5fr 1fr;margin-bottom:2px;font-size:12px;font-weight:700;color:var(--ink-3)}
.bx-cols span:last-child{text-align:right}
.bx-stat{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line)}
.bx-stat span{text-align:center;font-size:12.5px;color:var(--ink-2)}
.bx-stat b{font-family:var(--numeric);font-size:19px;font-weight:600;color:var(--ink-2)}
.bx-stat b:last-of-type{text-align:right}
.bx-stat b.hi{color:var(--ink);font-weight:700}
.bx-statbar{grid-column:1/-1;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ca) var(--pa),var(--ch) var(--pa));opacity:.85}
.bx-leader{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bx-leader>span{font-size:12px;font-weight:600;color:var(--ink-3)}
.bx-leader b{display:block;font-size:14px}
.bx-leader small{display:block;font-size:12px;color:var(--ink-2)}
.bx-leader .r{text-align:right}
.bx-facts{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink)}
.bx-msg,.bx-venue{margin:0;text-align:center;font-size:13px;color:var(--ink-3)}
.chance{display:grid;justify-items:end;gap:3px;min-width:48px}
.chance b{font-family:var(--numeric);font-size:22px;font-weight:700;line-height:1;color:var(--ink)}
.chance small{font-size:10.5px;font-weight:600;color:var(--ink-2);line-height:1}
.chance.out b{color:var(--ink-3)}
.crown{color:var(--accent)}
.rules{padding:0 4px}
.rules summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2);padding:6px 0}
.rules p{margin:4px 0 0}

/* family */
.frow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow input{width:100%;font:600 16px var(--font);padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
.frow input:focus{outline:none;border-color:var(--accent)}
.sw{grid-column:2;display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:0;background:var(--c)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.setrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.face-btn{border:0;background:none;padding:0;border-radius:50%}
.face-btn .jersey{width:40px;height:40px;font-size:17px}
.rrow[data-profile],.season tr[data-profile]{cursor:pointer}
.spoon{display:inline-flex}
.spoon .badge-ico{width:22px;height:22px}
.spoon .badge-ico svg{width:13px;height:13px}
.jersey.mini{width:20px;height:20px;font-size:10px;vertical-align:-5px;margin-right:2px}

/* badges, recap, chart, trophy case */
.badge-ico{width:30px;height:30px;flex:none;border-radius:50%;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--bc) 22%,var(--raised));color:var(--bc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bc) 45%,transparent)}
.badge-ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recap{background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 20%,var(--surface)),var(--surface) 62%);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px}
.podium3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin-top:14px}
.pd{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.pd .jersey{width:46px;height:46px;font-size:19px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.pd1 .jersey{width:62px;height:62px;font-size:26px}
.pd b{margin-top:8px;max-width:100%;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd small{font-size:12px;color:var(--ink-2)}
.pd-step{width:100%;margin-top:8px;border-radius:12px 12px 4px 4px;display:grid;justify-items:center;align-content:center;background:color-mix(in srgb,var(--c) 28%,var(--raised))}
.pd1 .pd-step{height:76px;background:linear-gradient(180deg,#F5B400,color-mix(in srgb,#F5B400 45%,var(--raised)));box-shadow:0 -8px 30px -12px #F5B400}
.pd1 .jersey{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c),0 0 26px 4px color-mix(in srgb,var(--c) 55%,transparent)}
.pd2 .pd-step{height:56px}
.pd3 .pd-step{height:40px}
.pd-step span{font-family:var(--display);font-size:12px;font-weight:700}
.pd-step em{font-style:normal;font-family:var(--numeric);font-size:17px;font-weight:700}
.pd1 .pd-step span,.pd1 .pd-step em{color:#1a1300}
.hl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.hl li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.hl li b{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.hl li span:not(.badge-ico){font-size:14px;line-height:1.35}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.lgd{display:inline-flex;align-items:center;gap:6px}
.lgd b{color:var(--ink);font-family:var(--numeric);font-size:16px}
.chart{position:relative;margin-top:8px}
.chart-svg{display:block;max-width:100%;height:auto;touch-action:pan-y}
.chart-svg .grid{stroke:var(--line);stroke-width:1}
.chart-svg .axis{fill:var(--ink-3);font:11px var(--font)}
.chart-svg .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart-svg .dot{stroke:var(--surface);stroke-width:2}
.chart-svg .leader{stroke:var(--ink-3);stroke-width:1}
.chart-svg .endlbl{fill:#fff;font:800 10px var(--font)}
.chart-tip{position:absolute;top:4px;z-index:2;min-width:150px;padding:8px 10px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:0 12px 26px -12px rgba(0,0,0,.8);display:grid;gap:3px;font-size:12.5px;pointer-events:none}
.chart-tip>b{margin-bottom:2px;font-size:12px;font-weight:700;color:var(--ink-2)}
.chart-tip span{display:flex;align-items:center;gap:6px;color:var(--ink)}
.chart-tip span i{width:8px;height:8px;border-radius:50%}
.chart-tip span b{margin-left:auto;padding-left:14px;font-family:var(--numeric);font-size:15px}
.plc{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:8px;background:var(--raised);color:var(--ink-2);font-family:var(--numeric);font-size:15px;font-weight:700}
.plc1{background:#F5B400;color:#1a1300}
.plc2{background:#C9D1DB;color:#11161c}
.plc3{background:#C88A57;color:#1b0f05}
.plc.last{box-shadow:inset 0 0 0 1.5px #C08A5B;color:#E0AE82}
.tc-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 16px;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.tc-row:first-of-type{border-top:0}
.tc-row b{font-weight:700}
.tc-row .chev{color:var(--ink-3)}
.tc-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.tc-b{position:relative;display:inline-grid}
.tc-b small{position:absolute;right:-6px;top:-6px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:800;display:grid;place-items:center}

/* profile sheet */
.pf-top{display:flex;align-items:center;gap:16px}
.pf-face{width:72px;height:72px;font-size:30px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.pf-id{display:grid;gap:2px;min-width:0}
.pf-id b{font-family:var(--display);font-size:19px;font-weight:700}
.pf-id span{font-size:13px;color:var(--ink-2)}
.pf-id .pf-state{color:var(--good);font-weight:600}
.pf-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pf-tiles div{display:grid;justify-items:center;gap:3px;padding:10px 4px;border-radius:14px;background:var(--raised)}
.pf-tiles b{font-family:var(--numeric);font-size:26px;line-height:1}
.pf-tiles span{font-size:11px;font-weight:600;color:var(--ink-3);text-align:center}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:14px;background:var(--raised);min-width:0}
.badge b{display:block;font-size:13.5px;line-height:1.25;margin-top:2px}
.badge small{display:block;font-size:11.5px;line-height:1.3;color:var(--ink-3)}
.badge.dim{opacity:.5}
.badge.dim .badge-ico{filter:grayscale(1)}
.pf-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:10px}
.pf-small{width:40px;height:40px;font-size:17px}
.pf-sw{margin-top:12px}

/* PIN pad */
dialog.pin{max-width:320px;padding:22px 20px 16px;text-align:center}
dialog.pin #pinFace{width:56px;height:56px;font-size:24px;display:grid;margin:0 auto 12px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:18px 0 4px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.shake{animation:shake .36s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pin-pad button{height:58px;border:0;border-radius:18px;background:var(--raised);color:var(--ink);font-family:var(--numeric);font-size:28px;font-weight:600}
.pin-pad button:active{background:var(--line-2)}
.pin-pad .pin-alt{background:transparent;font-family:var(--font);font-size:14px;font-weight:600;color:var(--ink-2)}
.pin-forgot{font-size:12.5px;margin-top:12px}

/* alerts, dialog, toast */
.alert{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:8;width:min(440px,calc(100% - 20px));border:0;border-radius:22px;padding:14px 16px 18px;color:#fff;cursor:pointer;overflow:hidden;text-align:left;font:inherit;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 78%,#000),color-mix(in srgb,var(--tc) 38%,#000));box-shadow:0 20px 50px -16px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.1)}
.alert::after{content:"";position:absolute;left:16px;right:16px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);transform-origin:left}
.alert.in{animation:alertIn .5s cubic-bezier(.2,1.25,.4,1)}
.alert.in::after{animation:alertTimer 6s linear forwards}
@keyframes alertIn{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
@keyframes alertTimer{to{transform:scaleX(0)}}
.al-head{display:flex;align-items:center;gap:10px}
.al-logo{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.16);padding:5px;object-fit:contain}
.al-kind{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.2}
.al-meta{margin-left:auto;font-size:12px;font-weight:600;opacity:.8;white-space:nowrap}
.al-score{display:flex;gap:10px;align-items:baseline;font-family:var(--numeric);font-size:40px;font-weight:700;margin-top:6px;line-height:1}
.al-score .lo{opacity:.5}
.al-people{margin-top:8px;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}
.al-people b{font-weight:800}
.al-close{flex:none;width:30px;height:30px;margin:-4px -6px -4px 0;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.al-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
dialog{border:1px solid var(--line-2);border-radius:22px;padding:20px;width:calc(100% - 32px);max-width:360px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700}
dialog p{margin:6px 0 0}
#parentPw{width:100%;margin-top:14px;font:600 17px var(--font);padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
#parentPw:focus{outline:none;border-color:var(--accent)}
.keep{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.dlgbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}

@media (max-width:520px){
  .team{gap:10px;padding:7px 10px 7px 7px}
  .tn b{font-size:15px}
  .sc{font-size:32px}
  .allpicks{width:100%;table-layout:fixed;font-size:12px}
  .allpicks th,.allpicks td{padding:6px 2px;white-space:normal}
  .allpicks th:first-child,.allpicks td:first-child{width:86px;padding-left:0}
  .allpicks th{min-width:0}
  .allpicks .pname{display:none}
  .allpicks th small{font-size:10px}
  .allpicks th .upct{display:block}
  .allpicks .jersey{width:24px;height:24px;font-size:12px}
  .gcell b{font-size:15px}
  .gcell span{font-size:10px;line-height:1.25}
  .plogo{width:34px;height:34px}
  .plogo img{width:24px;height:24px}
  .allpicks .mark{display:block;margin:1px 0 0;font-size:9px;text-align:center}
}
@media (prefers-reduced-motion:reduce){.alert.in,.alert.in::after,.sc.bump,.game.flash,.st.live::before,.pin-dots.shake,td.up .plogo{animation:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="topbar">
      <span class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#E23F17"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#markGrad)"/><path d="M9.5 16.5l4.3 4.3 8.7-9.3" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sunday Picks</span></span>
      <button type="button" class="me-btn" id="meBtn" aria-label="Open your profile"><span class="jersey" id="meFace"></span></button>
    </div>
    <div class="weeknav">
      <button id="prev" class="nav" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="wk"><b id="wkTitle">Week –</b><span id="wkDates">Loading schedule…</span></div>
      <button id="next" class="nav" aria-label="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</header>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="picks" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>Picks</span></button>
  <button role="tab" data-tab="all" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>All picks</span></button>
  <button role="tab" data-tab="standings" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h8M12 16v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4.5a2.5 2.5 0 002.8 3.6M17 6h2.5a2.5 2.5 0 01-2.8 3.6"/></svg><span>Standings</span></button>
  <button role="tab" data-tab="family" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M3 19.5a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.4"/><path d="M16.2 14a4.6 4.6 0 015.3 5.5"/></svg><span>Family</span></button>
</nav>
<main id="app"><div class="empty">Loading…</div></main>
<div class="alert" id="alert" role="status" aria-live="polite" hidden></div>
<dialog id="boxDlg" class="sheet" aria-labelledby="boxTitle">
  <div class="box-head"><h3 id="boxTitle">Box score</h3><button type="button" class="box-close" data-box-close aria-label="Close box score"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="boxBody"></div>
</dialog>
<dialog id="profDlg" class="sheet" aria-labelledby="profTitle">
  <div class="box-head"><h3 id="profTitle">Profile</h3><button type="button" class="box-close" data-prof-close aria-label="Close profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="profBody"></div>
</dialog>
<dialog id="pinDlg" class="pin" aria-labelledby="pinTitle">
  <span class="jersey" id="pinFace"></span>
  <h3 id="pinTitle">PIN</h3>
  <p class="muted" id="pinWhy"></p>
  <div class="pin-dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="err" id="pinErr" role="alert" hidden></p>
  <div class="pin-pad">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
    <button type="button" class="pin-alt" data-key="cancel">Cancel</button><button type="button" data-key="0">0</button><button type="button" class="pin-alt" data-key="back" aria-label="Delete last digit">⌫</button>
  </div>
  <p class="muted pin-forgot" id="pinForgot">Forgot it? A parent can reset it from the profile.</p>
</dialog>
<div class="toast" id="toast" hidden></div>
<dialog id="parentDlg" aria-labelledby="parentTitle">
  <form id="parentForm">
    <h3 id="parentTitle">Parent password</h3>
    <p class="muted" id="parentWhy"></p>
    <input type="email" id="parentUser" autocomplete="username" hidden>
    <input type="password" id="parentPw" autocomplete="current-password" aria-label="Parent password" required>
    <label class="keep"><input type="checkbox" id="parentKeep"> Keep a parent signed in on this device</label>
    <p class="err" id="parentErr" hidden></p>
    <div class="dlgbtns"><button type="button" class="toggle" id="parentCancel">Cancel</button><button type="submit" class="primary" id="parentGo">Continue</button></div>
  </form>
</dialog>

<script type="module">
import {firebaseConfig,parentEmail} from './config.js';
import {fetchWeek,fetchWinProb,fetchGameSummary,fetchClosingLine,groupIntoPickWeeks} from './espn.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,collection,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const COLORS=['#E8641E','#2E6FD8','#C23B6B','#1E9E8A','#7B4FC9','#D9432B','#B71C1C','#AD1457','#E0457B','#A43BB5','#5B5BD6','#1565C0','#1B8FD1','#0F8C9E','#2F8F3A','#558B2F','#8A7A12','#C9A200','#D98200','#A0522D','#6D4C41','#4A5560','#37474F','#2B2F36'];
const DEFAULT_FAMILY={players:[1,2,3,4,5].map((i)=>({id:'p'+i,name:'Player '+i,color:COLORS[i-1]}))};
const S={db:null,auth:null,parent:false,liveProb:{},profiles:{},lines:{},fillShown:{},family:DEFAULT_FAMILY,weeks:{},picks:{},locks:{},week:null,me:'p1',tab:'picks',results:false,ready:false,offline:false};
const $=(s)=>document.querySelector(s);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
S.me=store.get('picker')||'p1';S.tab=store.get('tab')||'picks';

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
function textOn(hex){const h=hex.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return (.2126*r+.7152*g+.0722*b)>.45?'#111':'#fff'}
function players(){return (S.family.players||DEFAULT_FAMILY.players).slice(0,5).map(p=>{const pr=S.profiles[p.id]||{};return {...p,color:pr.color||p.color}})}
function player(id){return players().find(p=>p.id===id)||players()[0]}
function initial(p){return esc((p.name||'?').trim().charAt(0).toUpperCase())}
// Late-pick days (Eastern date -> minutes after kickoff that picks stay open)
const LATE_PICKS={'2026-09-13':60};
const etDate=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
function lockTime(g){const t=new Date(g.t);return t.getTime()+(LATE_PICKS[etDate.format(t)]||0)*60e3}
// Who a pick is tracking: final result, or the current leader while a game is live
function pickState(g,pick){
  if(!pick)return '';
  if(g.w)return g.w==='TIE'?'':(pick===g.w?'ok':'no');
  if(g.st!=='in')return '';
  if(g.as===g.hs)return 'even';
  return pick===(g.as>g.hs?g.a.ab:g.h.ab)?'up':'down';
}
function weekLocked(w=S.week){return !!(S.locks['w'+w]&&S.locks['w'+w].locked)}
function locked(g,w=S.week){return weekLocked(w)||g.st==='post'||!!g.w||Date.now()>=lockTime(g)}
function pickDoc(week,pid){return S.picks['w'+week+'-'+pid]||{week,player:pid,picks:{}}}
function picksFor(week,pid){return pickDoc(week,pid).picks||{}}
function weekGames(w){return (S.weeks[w]||{}).games||[]}
// Weeks 19-22 are the playoffs; ESPN numbers those rounds 1, 2, 3 and 5
const MAX_WEEK=22;
const ROUNDS={19:{name:'Wild Card',short:'WC',espn:1},20:{name:'Divisional',short:'DIV',espn:2},21:{name:'Conference',short:'CONF',espn:3},22:{name:'Super Bowl',short:'SB',espn:5}};
function weekName(w){return ROUNDS[w]?ROUNDS[w].name:'Week '+w}
function isTbd(g){return g.a.ab==='TBD'||g.h.ab==='TBD'}

const fmtDay=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric'});
const fmtShort=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'});
const fmtTime=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'});
const etParts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',hour12:false});
function slotLabel(g){
  if(g.tbd)return '';
  const p=Object.fromEntries(etParts.formatToParts(new Date(g.t)).map(x=>[x.type,x.value]));
  const h=+p.hour;
  if(p.weekday==='Thu'&&h>=19)return 'TNF';
  if(p.weekday==='Sun'&&h>=20)return 'SNF';
  if(p.weekday==='Mon'&&h>=19)return 'MNF';
  return '';
}

/* ---- scoring ---- */
// Week points by final place: 1st, 2nd, 3rd
const PLACE_POINTS=[3,2,1];
const PLACE_LABEL=['1st','2nd','3rd','4th','5th'];
/* Weekly order: most correct picks, then closest guess of total points in the
   week's last game, then a guess that isn't over, then whoever saved their guess first. */
function weekScore(w){
  const games=weekGames(w);const done=games.filter(g=>g.w);
  const last=games[games.length-1];
  const actual=last&&last.w?last.as+last.hs:null;
  const rows=players().map((p,idx)=>{
    const doc=pickDoc(w,p.id),pk=doc.picks||{};let right=0,wrong=0,made=0,up=0;
    games.forEach(g=>{if(pk[g.id])made++;if(pickState(g,pk[g.id])==='up')up++});
    done.forEach(g=>{if(g.w==='TIE')return; if(pk[g.id]===g.w)right++; else wrong++});
    return {p,right,wrong,made,up,idx,tb:typeof doc.tb==='number'?doc.tb:null,tbAt:doc.tbAt||'9999'};
  });
  const complete=games.length>0&&done.length===games.length;
  const tiebreak=(a,b)=>{
    if(actual===null)return 0;
    if((a.tb===null)!==(b.tb===null))return a.tb===null?1:-1;
    if(a.tb!==null){
      const d=Math.abs(a.tb-actual)-Math.abs(b.tb-actual);if(d)return d;
      const oa=a.tb>actual,ob=b.tb>actual;if(oa!==ob)return oa?1:-1;
    }
    return a.tbAt<b.tbAt?-1:a.tbAt>b.tbAt?1:a.idx-b.idx;
  };
  rows.sort((a,b)=>b.right-a.right||(complete?tiebreak(a,b):a.wrong-b.wrong||a.idx-b.idx));
  rows.forEach((r,i)=>{
    r.place=i+1;
    r.pts=complete?(PLACE_POINTS[i]||0):0;
    r.tied=rows.some(x=>x!==r&&x.right===r.right);
  });
  const top=Math.max(...rows.map(r=>r.right));
  rows.forEach(r=>r.lead=done.length>0&&r.right===top&&top>0);
  const winner=complete?rows[0]:null;
  const byTiebreak=!!winner&&rows.filter(r=>r.right===winner.right).length>1;
  return {rows,winner,byTiebreak,actual,last,complete,done:done.length,total:games.length,top};
}
function currentWeek(){
  const now=Date.now();
  for(let w=1;w<=MAX_WEEK;w++){const gs=weekGames(w);if(!gs.length)continue;
    const last=Math.max(...gs.map(g=>new Date(g.t).getTime()));
    if(last+12*3600e3>now||gs.some(g=>!g.w))return w;}
  return MAX_WEEK;
}

/* ---- rendering ---- */
function render(){
  const w=S.week;
  $('#prev').disabled=!w||w<=1;$('#next').disabled=!w||w>=MAX_WEEK;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const gs=weekGames(w);
  $('#wkTitle').textContent=S.tab==='family'?'Family':(w?weekName(w):'Week –');
  if(S.tab==='family'){$('#wkDates').textContent='Names & colors'}
  else if(gs.length){const a=new Date(gs[0].t),b=new Date(gs[gs.length-1].t);$('#wkDates').textContent=fmtShort.format(a)+' – '+fmtShort.format(b)+' · '+gs.length+' games'+(S.scoreError?' · scores offline':'')}
  else $('#wkDates').textContent=S.ready?'Schedule not loaded yet':'Loading schedule…';
  $('.weeknav').hidden=S.tab==='family';
  const meP=player(S.me),face=$('#meFace');
  face.className='jersey av-'+meP.id;face.style.setProperty('--c',meP.color);face.textContent=(meP.name||'?').trim().charAt(0).toUpperCase();
  $('#meBtn').classList.toggle('unlocked',isUnlocked(meP.id));
  $('#meBtn').setAttribute('aria-label',`Open ${meP.name}’s profile`);
  const app=$('#app');
  if(S.offline){app.innerHTML='<div class="empty"><b>Sunday Picks isn’t connected to its database yet.</b><br>Add your Firebase settings to config.js.</div>';return}
  if(S.tab==='family')return renderFamily(app);
  if(!gs.length){app.innerHTML='<div class="empty">'+(S.ready?'No games found for this week yet.':'Loading the schedule…')+'</div>';return}
  if(S.tab==='standings')return renderStandings(app);
  if(S.tab==='all')return renderAllPicks(app);
  renderPicks(app);
}

// Everyone has picked every game they still can (and set a tiebreaker while it's open)
function allSubmitted(w){
  const gs=weekGames(w);if(!gs.length||gs.some(isTbd))return false;
  const now=Date.now(),last=gs[gs.length-1];
  return players().every(p=>{
    const d=pickDoc(w,p.id),pk=d.picks||{};
    return gs.every(g=>pk[g.id]||g.w||now>=lockTime(g))&&(typeof d.tb==='number'||now>=lockTime(last));
  });
}
// Lock a week automatically once all picks are in. A week with any lock record
// (including one someone unlocked by hand) is left alone.
function maybeAutoLock(){
  if(!S.db||!S.ready||!S.picksLoaded||!S.locksLoaded)return;
  for(let w=1;w<=MAX_WEEK;w++){
    const key='w'+w;
    if(S.locks[key]||!allSubmitted(w))continue;
    S.locks={...S.locks,[key]:{week:w,locked:true,auto:true,at:new Date().toISOString()}};
    S.db.doc('locks/'+key).set(S.locks[key]).then(()=>toast(`Everyone’s picks are in. ${weekName(w)} is locked.`)).catch(()=>{const n={...S.locks};delete n[key];S.locks=n;render()});
    render();
  }
}

function setLock(w,locked){
  const key='w'+w,prev=S.locks[key];
  S.locks={...S.locks,[key]:{week:w,locked,at:new Date().toISOString()}};render();
  return S.db.doc('locks/'+key).set(S.locks[key])
    .then(()=>toast(locked?`${weekName(w)} picks locked`:`${weekName(w)} picks unlocked`))
    .catch(()=>{S.locks={...S.locks,[key]:prev};render();toast(locked?'The lock didn’t save. Try again.':'Only a parent can unlock picks.')});
}

/* ---- parent controls ---- */
let afterParent=null;
function requireParent(why,action){
  if(S.parent){action();return}
  if(!S.auth){toast('Parent sign-in isn’t available right now.');return}
  afterParent=action;
  $('#parentWhy').textContent=why;
  $('#parentErr').hidden=true;
  $('#parentPw').value='';
  $('#parentKeep').checked=false;
  $('#parentDlg').showModal();
  $('#parentPw').focus();
}
function signInError(code){
  if(code==='auth/too-many-requests')return 'Too many tries. Wait a few minutes, then try again.';
  if(code==='auth/network-request-failed')return 'No connection. Check your internet and try again.';
  if(code==='auth/operation-not-allowed'||code==='auth/configuration-not-found')return 'Parent sign-in isn’t turned on in Firebase yet.';
  return 'That password didn’t work. Try again.';
}
$('#parentUser').value=parentEmail||'';
$('#boxDlg').addEventListener('close',()=>{boxOpenId=null;clearTimeout(boxTimer)});
$('#boxDlg').addEventListener('click',(e)=>{if(e.target===e.currentTarget)closeBox()});
$('#profDlg').addEventListener('close',()=>{profOpen=null});
$('#profDlg').addEventListener('click',(e)=>{if(e.target===e.currentTarget)closeProfile()});
$('#pinDlg').addEventListener('cancel',(e)=>{e.preventDefault();closePin(true)});
$('#parentCancel').addEventListener('click',()=>{afterParent=null;$('#parentDlg').close()});
$('#parentForm').addEventListener('submit',async(e)=>{
  e.preventDefault();e.stopPropagation();
  const go=$('#parentGo');go.disabled=true;
  try{
    await signInWithEmailAndPassword(S.auth,parentEmail,$('#parentPw').value);
    const keep=$('#parentKeep').checked,action=afterParent;
    afterParent=null;$('#parentPw').value='';$('#parentDlg').close();
    try{if(action)await action()}
    finally{if(!keep)await signOut(S.auth)}
  }catch(err){
    $('#parentErr').textContent=signInError(err&&err.code);$('#parentErr').hidden=false;
  }finally{go.disabled=false}
});

function lockButton(w){
  return `<button class="toggle" id="lockToggle" aria-pressed="${weekLocked(w)}">${weekLocked(w)?'Unlock':'Lock all picks'}</button>`;
}

function renderPicks(app){
  const w=S.week,gs=weekGames(w),me=player(S.me),mine=picksFor(w,me.id);
  const sc=weekScore(w);
  const allLocked=gs.length>0&&gs.every(g=>locked(g));
  // Someone's open picks stay private until they enter their PIN on this device
  const canSee=allLocked||S.parent||isUnlocked(me.id);
  const shown=canSee?mine:Object.fromEntries(Object.entries(mine).filter(([id])=>{const g=gs.find(x=>x.id===id);return g&&locked(g)}));
  let h='';
  const byPlayer=Object.fromEntries(sc.rows.map(r=>[r.p.id,r]));
  const meRow=byPlayer[me.id];
  const summary=sc.done?`<span class="num">${meRow.right}–${meRow.wrong}</span>${meRow.up?` · <span class="upct">${meRow.up} winning now</span>`:''}`:'';
  h+=`<section class="viewer"><div class="viewer-head"><span>${allLocked?'Viewing as':'Picking as'} <b>${esc(me.name)}</b>${isUnlocked(me.id)?' <button type="button" class="linkbtn sm" data-pin-signout>Sign out</button>':''}</span><span class="viewer-sum">${summary}</span></div><div class="pickers" role="group" aria-label="Choose whose picks to show">`;
  players().forEach(p=>{
    const r=byPlayer[p.id];
    const n=Object.keys(picksFor(w,p.id)).filter(id=>gs.some(g=>g.id===id)).length;
    h+=`<button class="pk" style="--c:${esc(p.color)}" data-picker="${esc(p.id)}" aria-pressed="${p.id===me.id}" aria-label="Show ${esc(p.name)}’s picks"><span class="jersey av-${p.id}">${initial(p)}</span><span class="nm">${esc(p.name)}</span><span class="ct num">${sc.done?`${r.right}–${r.wrong}`:`${n}/${gs.length}`}</span></button>`;
  });
  h+='</div></section>';
  const open=gs.filter(g=>!locked(g)&&!mine[g.id]).length;
  const defaults=players().every(p=>/^Player \d$/.test(p.name));
  const status=S.results?'<b>Entering results.</b> Tap the team that won each game.'
    :weekLocked(w)?`<b>${S.locks['w'+w].auto?`Everyone’s picks are in, so ${weekName(w)} is locked.`:`Picks are locked for ${weekName(w)}.`}</b> Everyone’s picks now show.`
    :!canSee?`<b>${esc(me.name)}</b> · tap a team and enter your PIN to pick`
    :`<b>${esc(me.name)}</b> is picking · ${open?`<span class="num">${open}</span> open game${open>1?'s':''} left`:'all set for this week'}`;
  if(allLocked)h+=`<div class="lockbar"><span class="pill">Locked</span><span class="lb-text">${weekLocked(w)&&S.locks['w'+w].auto?'Everyone’s picks are in.':'Picks are closed for this week.'}</span>${weekLocked(w)?lockButton(w):''}</div>`;
  else h+=`<div class="note"><span>${status}</span>
      <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${defaults&&!S.results?'<button class="linkbtn" data-tab="family">Add your names</button>':''}${S.results?'':lockButton(w)}</span></div>`;

  let lastDay='';
  gs.forEach(g=>{
    const d=new Date(g.t),day=g.tbd?weekName(w)+' · Date TBD':fmtDay.format(d);
    if(day!==lastDay){if(lastDay)h+='</section>';h+=`<section class="day"><div class="dayhead"><h2>${esc(day)}</h2></div>`;lastDay=day}
    h+=gameCard(g,w,me,shown,g===gs[gs.length-1]);
  });
  h+='</section>';
  app.innerHTML=h;
  app.classList.toggle('resultmode',S.results);
}

function teamBtn(g,side,me,mine,pips){
  const t=g[side],isMine=mine[g.id]===t.ab,won=g.w===t.ab,lost=g.w&&g.w!=='TIE'&&!won;
  const live=!g.w&&g.st==='in',mineState=isMine?pickState(g,t.ab):'';
  const ahead=live&&(side==='a'?g.as>g.hs:g.hs>g.as),behind=live&&(side==='a'?g.as<g.hs:g.hs<g.as);
  const cls=['team',isMine?'mine':'',mineState,won?'won':'',lost?'lost':'',behind?'behind':'',ahead?'ahead':''].join(' ');
  const tag=mineState==='up'?'Winning':mineState==='down'?'Losing':mineState==='even'?'Tied':mineState==='ok'?'Right':mineState==='no'?'Wrong':'';
  const started=g.st!=='pre'||!!g.w;
  return `<button class="${cls}" style="--tc:${esc(t.c)};--me:${esc(me.color)}" data-game="${esc(g.id)}" data-team="${esc(t.ab)}" ${locked(g)?'aria-disabled="true"':''} ${isTbd(g)?'aria-disabled="true"':''} aria-pressed="${isMine}" aria-label="${esc(t.loc+' '+t.name+(t.rec?', '+t.rec:''))}">
    <span class="logo">${t.logo?`<img src="${esc(t.logo)}" alt="" width="30" height="30" loading="lazy">`:`<span class="ab">${esc(t.ab)}</span>`}</span>
    <span class="tn"><b>${esc(t.name)}</b><span class="sub">${tag?`<em class="tag">${tag}</em>`:`<span class="num">${esc(t.rec||t.loc)}</span>`}</span></span>
    <span class="pips">${pips||''}</span>
    ${started?`<span class="sc num${flashing(g,side)?' bump':''}">${side==='a'?g.as:g.hs}</span>`:'<span class="pickmark" aria-hidden="true"></span>'}
  </button>`;
}

function tiebreakRow(g,w,me){
  if(!locked(g)){
    const tb=S.parent||isUnlocked(me.id)?pickDoc(w,me.id).tb:null;
    return `<label class="tb"><span><b>Tiebreaker</b> · ${esc(me.name)}, how many total points will both teams score?</span><input type="number" min="0" max="150" inputmode="numeric" data-tb="${esc(g.id)}" value="${typeof tb==='number'?tb:''}" placeholder="45" aria-label="Tiebreaker guess for ${esc(me.name)}"></label>`;
  }
  const guesses=players().map(p=>{const tb=pickDoc(w,p.id).tb;return `<span class="guess"><span class="pip av-${p.id}" style="--c:${esc(p.color)}" title="${esc(p.name)}" aria-label="${esc(p.name)}">${initial(p)}</span>${typeof tb==='number'?tb:'–'}</span>`}).join('');
  return `<div class="tb"><span><b>Tiebreaker guesses</b>${g.w?` · final total <b class="num">${g.as+g.hs}</b>`:''}</span><div class="dots">${guesses}</div></div>`;
}

// Spreads disappear from the feed at kickoff, so remember the last one seen on this device
const spreads=(()=>{try{return JSON.parse(store.get('spreads')||'{}')}catch{return {}}})();
function rememberLine(g){
  if(!g.spread)return false;
  const prev=spreads[g.id]||{};
  const next={s:g.spread,ou:g.ou,hl:g.hl,ml:g.ml&&g.ml.h!=null&&g.ml.a!=null?g.ml:prev.ml};
  if(JSON.stringify(prev)===JSON.stringify(next))return false;
  spreads[g.id]=next;return true;
}
function spreadText(g){
  rememberLine(g);
  const sp=g.spread?{s:g.spread,ou:g.ou}:spreads[g.id];
  if(sp)return `${sp.s}${sp.ou!=null?' · O/U '+sp.ou:''}`;
  const saved=(S.lines['w'+pickWeekOf(g.id)]||{})[g.id];
  if(saved&&saved.fav&&saved.line!=null)return `${saved.fav} -${saved.line}`;
  return `${g.a.ab} @ ${g.h.ab}`;
}

function gameCard(g,w,me,mine,isLast){
  const lk=locked(g),slot=slotLabel(g);
  let status;
  if(g.w)status=`<span class="st final">${g.w==='TIE'?'Final · Tie':'Final'}</span>`;
  else if(g.st==='in')status=`<span class="st live">${esc(g.d||'Live')}</span>`;
  else if(Date.now()>=new Date(g.t).getTime())status=`<span class="st live">Kicked off${lk?'':' · picks open until '+fmtTime.format(new Date(lockTime(g)))}</span>`;
  else status=`<span class="st">${g.tbd?'Time TBD':fmtTime.format(new Date(g.t))}${slot?`<span class="slot">${slot}</span>`:''}${lk&&!weekLocked(w)?' · locked':''}</span>`;
  const who=players().map(p=>({p,pick:picksFor(w,p.id)[g.id]})).filter(x=>x.pick);
  const pips=(ab)=>lk?who.filter(x=>x.pick===ab).map(x=>`<span class="pip ${pickState(g,x.pick)} av-${x.p.id}" style="--c:${esc(x.p.color)}" title="${esc(x.p.name)}" aria-label="${esc(x.p.name)}">${initial(x.p)}</span>`).join(''):'';
  let h=`<article class="game${flashing(g)?' flash':''}"><button type="button" class="gmeta" data-box="${esc(g.id)}" aria-label="Box score, ${esc(g.a.name)} at ${esc(g.h.name)}">${status}<span class="line">${esc(lk?spreadText(g):`${g.a.ab} @ ${g.h.ab}`)}<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></button>
    <div class="rows">${teamBtn(g,'a',me,mine,pips(g.a.ab))}${teamBtn(g,'h',me,mine,pips(g.h.ab))}</div>`;
  if(isTbd(g))h+='<p class="sealed">Matchup is set once the previous round ends</p>';
  else if(!lk)h+=`<p class="sealed">${who.length}/${players().length} picked · revealed when picks lock</p>`;
  if(isLast)h+=tiebreakRow(g,w,me);
  return h+'</article>';
}

const fmtKick=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'});
function renderAllPicks(app){
  const w=S.week,gs=weekGames(w),ps=players(),sc=weekScore(w);
  const rec=Object.fromEntries(sc.rows.map(r=>[r.p.id,r]));
  const anyOpen=gs.some(g=>!locked(g));

/* ---- weekly win chances ---- */
// Standard normal CDF (Abramowitz-Stegun 7.1.26)
function phi(z){const t=1/(1+.3275911*Math.abs(z)/Math.SQRT2),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-z*z/2);return z>=0?(1+y)/2:(1-y)/2}
function gauss(){let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())}
function impliedProb(o){return o<0?-o/(-o+100):100/(o+100)}
// Share of regulation still to play (overtime counts as a sliver)
function timeLeft(g){
  if(g.st!=='in'||!g.period)return 1;
  if(g.period>4)return Math.max(0,Math.min(1,g.clock/3600));
  return Math.max(0,Math.min(1,((4-g.period)*900+g.clock)/3600));
}
function homeWinProb(g){
  if(g.w)return g.w===g.h.ab?1:g.w==='TIE'?.5:0;
  const c=spreads[g.id]||{},ml=g.ml&&g.ml.h!=null&&g.ml.a!=null?g.ml:c.ml,hl=g.hl!=null?g.hl:c.hl;
  let pre=.5;
  if(ml&&ml.h!=null&&ml.a!=null){const ih=impliedProb(ml.h),ia=impliedProb(ml.a);pre=ih/(ih+ia)}
  else if(hl!=null)pre=phi(-hl/13.5);
  if(g.st!=='in')return pre;
  if(g.liveProb!=null)return g.liveProb;
  if(S.liveProb[g.id])return S.liveProb[g.id].p;
  // Fallback: current margin plus the pregame line scaled to the time left
  const f=timeLeft(g),line=hl!=null?hl:-13.5*(pre-.5)*2.5;
  return phi(((g.hs-g.as)-line*f)/(13.5*Math.sqrt(Math.max(f,.003))));
}
function totalSampler(g){
  if(g.w)return ()=>g.as+g.hs;
  const c=spreads[g.id]||{},ou=g.ou??c.ou??44,cur=g.as+g.hs,f=timeLeft(g);
  const mean=cur+ou*f,sd=Math.max(1,13*Math.sqrt(f));
  return ()=>Math.max(cur,Math.round(mean+sd*gauss()));
}
const SIMS=20000;
let chanceCache={key:'',value:null};
function winChances(w){
  const games=weekGames(w);
  if(!games.length)return null;
  const ps=players(),last=games[games.length-1];
  const pending=games.filter(g=>!g.w).map(g=>({g,ph:homeWinProb(g)}));
  if(!pending.length)return null;
  const docs=ps.map(p=>pickDoc(w,p.id));
  const key=JSON.stringify([w,pending.map(x=>[x.g.id,Math.round(x.ph*1000)]),games.filter(g=>g.w).map(g=>g.id+g.w),last.as,last.hs,last.period,last.clock,docs.map(d=>[d.picks,d.tb,d.tbAt])]);
  if(chanceCache.key===key)return chanceCache.value;
  const picks=docs.map(d=>d.picks||{});
  const base=ps.map((p,i)=>games.filter(g=>g.w&&g.w!=='TIE'&&picks[i][g.id]===g.w).length);
  const pickIdx=pending.map(({g})=>picks.map(pk=>pk[g.id]===g.h.ab?1:pk[g.id]===g.a.ab?0:-1));
  const tb=docs.map(d=>typeof d.tb==='number'?d.tb:null),tbAt=docs.map(d=>d.tbAt||'9999');
  const sampleTotal=totalSampler(last);
  const wins=new Array(ps.length).fill(0),score=new Array(ps.length);
  for(let n=0;n<SIMS;n++){
    for(let i=0;i<ps.length;i++)score[i]=base[i];
    for(let k=0;k<pending.length;k++){
      const homeWon=Math.random()<pending[k].ph?1:0,row=pickIdx[k];
      for(let i=0;i<ps.length;i++)if(row[i]===homeWon)score[i]++;
    }
    const total=sampleTotal();
    let best=0;
    for(let i=1;i<ps.length;i++){
      let d=score[i]-score[best];
      if(!d){
        const ti=tb[i],tj=tb[best];
        if((ti===null)!==(tj===null))d=ti===null?-1:1;
        else if(ti!==null){
          d=Math.abs(tj-total)-Math.abs(ti-total);
          if(!d){const oi=ti>total,oj=tj>total;if(oi!==oj)d=oi?-1:1}
        }
        if(!d)d=tbAt[i]<tbAt[best]?1:tbAt[i]>tbAt[best]?-1:0;
      }
      if(d>0)best=i;
    }
    wins[best]++;
  }
  // Out: can't even catch the current leader by winning every remaining pick
  const lead=Math.max(...base);
  const value={out:new Set(),p:{}};
  ps.forEach((p,i)=>{
    value.p[p.id]=wins[i]/SIMS;
    const canGain=pickIdx.filter(row=>row[i]!==-1).length;
    if(base[i]+canGain<lead)value.out.add(p.id);
  });
  chanceCache={key,value};
  return value;
}
function chanceLabel(ch,id){
  if(ch.out.has(id))return 'Out';
  const v=ch.p[id];
  return v>=1?'100%':v>.99?'>99%':v>0&&v<.01?'<1%':Math.round(v*100)+'%';
}
function chanceHtml(ch,r){
  if(!ch)return '<span></span>';
  const v=ch.p[r.p.id],out=ch.out.has(r.p.id);
  return `<div class="chance${out?' out':''}" aria-label="${esc(r.p.name)} win chance ${chanceLabel(ch,r.p.id)}"><b class="num">${chanceLabel(ch,r.p.id)}</b><small>to win</small></div>`;
}

function renderStandings(app){
  const w=S.week,sc=weekScore(w),chances=sc.complete?null:winChances(w),stats=seasonStats();
  let h='';
  if(sc.complete)h+=recapCard(w,sc);
  h+=`<section class="card"><p class="eyebrow">${weekName(w)} · ${sc.complete?'Final':`${sc.done} of ${sc.total} final`}</p><div class="rank">${chances?'<canvas class="sparks" aria-hidden="true"></canvas>':''}`;
  let pos=0,prev=null;
  sc.rows.forEach((r,i)=>{
    if(sc.complete)pos=r.place; else if(prev===null||r.right!==prev){pos=i+1;prev=r.right}
    if(!sc.done)pos='–';
    // Every row gets a second line so names stay in one column
    const left=sc.total-sc.done;
    const notes=[];
    if(!sc.done)notes.push(`${r.made}/${sc.total} picked`);
    else if(!sc.complete&&r.up)notes.push(`<b class="upct">${r.up} winning now</b>`);
    else if(!sc.complete)notes.push(`${left} game${left===1?'':'s'} left`);
    else notes.push(r.tied?`Tiebreaker ${r.tb===null?'—':r.tb}`:'Final');
    const spoon=sc.complete&&r.place===sc.rows.length;
    // Win chance fills the row from the left in the person's color
    const fill=chances?(chances.out.has(r.p.id)?0:Math.round((chances.p[r.p.id]||0)*100)):0;
    const leadChance=chances&&fill>0&&fill===Math.max(...sc.rows.map(x=>chances.out.has(x.p.id)?0:Math.round((chances.p[x.p.id]||0)*100)));
    // Fill animates from the last value shown; a redraw mid-animation picks up where it left off
    const fkey=w+':'+r.p.id,prevFill=S.fillShown[fkey],now=Date.now();
    let from=0,start=now;
    if(prevFill){if(prevFill.to===fill){from=prevFill.from;start=prevFill.start}else{from=prevFill.to}}
    if(chances)S.fillShown[fkey]={from,to:fill,start};
    const dur=600+Math.round(1200*fill/100),elapsed=now-start,filling=chances&&from!==fill&&elapsed<dur;
    h+=`<div class="rrow${chances?' has-chance':''}${leadChance?' lead':''}${filling?' filling':''}" data-profile="${r.p.id}" style="--c:${esc(r.p.color)};--p:${fill}%;--p0:${from}%;--g:${(fill/100).toFixed(2)};--dur:${dur}ms;--delay:-${filling?elapsed:0}ms;--edge:${fill>0&&fill<100?1:0}"><span class="pos num">${pos}</span><span class="jersey av-${r.p.id}">${initial(r.p)}</span>
      <div class="who"><b>${esc(r.p.name)} ${sc.complete&&r.place===1?'<span class="crown" aria-label="Week winner">★</span>':''}${spoon?`<span class="spoon" title="Wooden Spoon">${badgeIcon(BADGE.spoon)}</span>`:''}</b><span class="num">${notes.join(' · ')}</span></div>
      ${chanceHtml(chances,r)}<div class="rec num">${r.right}–${r.wrong}<small>${sc.complete?`<b class="ptsb">+${r.pts} pts</b>`:'W–L'}</small></div></div>`;
  });
  h+='</div></section>';
  h+=seasonSection(stats,false);
  if(Object.values(stats).some(o=>Object.keys(o.weeks).some(k=>+k>18)))h+=seasonSection(stats,true);
  h+=trophyCase(stats);
  h+=`<details class="rules"><summary>How scoring works</summary><p class="muted">Each week ends with a final order by correct picks. 1st place gets 3 points, 2nd gets 2 and 3rd gets 1; last place gets the Wooden Spoon. If people tie on correct picks, the closest guess of total points in the week’s last game goes ahead, then a guess that didn’t go over, then whoever saved their guess first. Tied NFL games don’t count, and a missed pick counts as a loss. Season standings count regular-season points only; the playoffs have their own standings. People tied on points share the spot. Win chances play out the rest of the week 20,000 times using ESPN’s live win probability (betting odds before kickoff) and everyone’s tiebreaker guesses. Badges: Weekly Champ (1st in a week), Perfect Week (every pick right), Upset Artist (picked an underdog that won), Hot Streak (5 right in a row), Tiebreak Wizard (exact tiebreaker total) and Wooden Spoon (last in a week).</p></details>`;
  app.innerHTML=h;
  if(chances)startSparks();
}

/* ---- sparks thrown off each win-chance edge ---- */
const sparks={parts:[],raf:0,last:0,moving:{},emitted:{}};
function startSparks(){
  if(sparks.raf||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sparks.last=performance.now();
  sparks.raf=requestAnimationFrame(sparkFrame);
}
// Sparks fly only while a fill is moving, with a burst when it lands; then the loop shuts off
function sparkFrame(t){
  const canvas=document.querySelector('.rank canvas.sparks');
  if(!canvas||document.hidden){sparks.raf=0;sparks.parts.length=0;sparks.moving={};return}
  const dt=Math.min(50,t-sparks.last)/1000;sparks.last=t;
  const box=canvas.parentElement,br=box.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const W=Math.round(br.width),H=Math.round(br.height);
  if(canvas.width!==W*dpr||canvas.height!==H*dpr){canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px'}
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  let anyMoving=false;
  for(const row of box.querySelectorAll('.rrow.has-chance')){
    const cs=getComputedStyle(row),f=parseFloat(cs.getPropertyValue('--f'))||0,target=parseFloat(cs.getPropertyValue('--p'))||0,g=parseFloat(cs.getPropertyValue('--g'))||0;
    const id=row.dataset.profile,moving=Math.abs(target-f)>.05,landed=!moving&&sparks.moving[id];
    sparks.moving[id]=moving;
    if(f<=0&&target<=0)continue;
    const rr=row.getBoundingClientRect(),x=rr.left-br.left+rr.width*f/100,top=rr.top-br.top,c=row.style.getPropertyValue('--c')||'#ffffff';
    let count=0;
    if(moving){anyMoving=true;count=(80+300*g)*dt;if(Math.random()<dt*7)count+=8+22*g}
    else if(landed)count=30+80*g;
    for(let n=count;n>0;n--){if(n<1&&Math.random()>n)break;emitSpark(x,top,rr.height,g,c,id,landed)}
  }
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  sparks.parts=sparks.parts.filter(p=>{
    p.life+=dt;if(p.life>=p.max)return false;
    p.vx*=.9;p.vy=p.vy*.9+300*dt;
    const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt,tx=nx-p.vx*.045,ty=ny-p.vy*.045,a=1-p.life/p.max;
    ctx.strokeStyle=p.c;ctx.globalAlpha=.6*a;ctx.lineWidth=p.w*4;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(nx,ny);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.globalAlpha=a;ctx.lineWidth=p.w;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(nx,ny);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(nx,ny,p.w*.9,0,Math.PI*2);ctx.fill();
    p.x=nx;p.y=ny;return true;
  });
  if(sparks.parts.length>700)sparks.parts.splice(0,sparks.parts.length-700);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(!anyMoving&&!sparks.parts.length){sparks.raf=0;ctx.clearRect(0,0,W,H);return}
  sparks.raf=requestAnimationFrame(sparkFrame);
}
function emitSpark(x,top,h,g,c,id,burst){
  const speed=(130+420*g)*(.35+Math.random())*(burst?1.35:1),ang=(Math.random()-.4)*Math.PI*(burst?1.7:1);
  sparks.parts.push({x,y:top+3+Math.random()*(h-6),vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed-50,life:0,max:.28+Math.random()*(.3+.5*g),w:1+Math.random()*(1.4+1.4*g),c});

}

const BADGES=Object.values(BADGE);
function badgeIcon(b){return `<span class="badge-ico" style="--bc:${b.color}"><svg viewBox="0 0 24 24" aria-hidden="true">${b.icon}</svg></span>`}

let statsCache={key:'',value:null};
function seasonStats(){
  const ps=players();
  const key=JSON.stringify([S.picks,S.lines,ps.map(p=>p.id),Object.values(S.weeks).map(wk=>wk.games.map(g=>g.id+(g.w||'')+g.as+'-'+g.hs))]);
  if(statsCache.key===key)return statsCache.value;
  const out=Object.fromEntries(ps.map(p=>[p.id,{p,points:0,poPoints:0,champ:0,spoon:0,perfect:0,upsets:0,wizard:0,bestStreak:0,streak:0,right:0,wrong:0,weeks:{}}]));
  const seq=Object.fromEntries(ps.map(p=>[p.id,[]]));
  for(let w=1;w<=MAX_WEEK;w++){
    const games=weekGames(w);if(!games.length)continue;
    const lines=S.lines['w'+w]||{};
    for(const g of games){
      if(!g.w||g.w==='TIE')continue;
      const fav=lines[g.id];
      for(const p of ps){
        const pick=picksFor(w,p.id)[g.id],o=out[p.id],ok=pick===g.w;
        if(ok)o.right++;else o.wrong++;
        seq[p.id].push(ok);
        if(ok&&fav&&fav.fav&&pick!==fav.fav)o.upsets++;
      }
    }
    const sc=weekScore(w);if(!sc.complete)continue;
    for(const r of sc.rows){
      const o=out[r.p.id];
      if(w<=18)o.points+=r.pts;else o.poPoints+=r.pts;
      o.weeks[w]={pts:r.pts,place:r.place,right:r.right,wrong:r.wrong};
      if(r.place===1)o.champ++;
      if(r.place===sc.rows.length)o.spoon++;
      if(r.wrong===0&&r.right>0)o.perfect++;
      if(r.tb!==null&&sc.actual!==null&&r.tb===sc.actual)o.wizard++;
    }
  }
  for(const p of ps){let cur=0,best=0;for(const ok of seq[p.id]){cur=ok?cur+1:0;best=Math.max(best,cur)}out[p.id].streak=cur;out[p.id].bestStreak=best}
  statsCache={key,value:out};
  return out;
}

function recapCard(w,sc){
  const ps=players(),games=weekGames(w).filter(g=>g.w&&g.w!=='TIE'),lines=S.lines['w'+w]||{};
  const names=(list)=>list.map(p=>esc(p.name)).join(list.length===2?' and ':', ');
  const item=(b,label,text)=>`<li>${badgeIcon(b)}<div><b>${label}</b><span>${text}</span></div></li>`;
  const top=sc.rows.slice(0,3),order=[top[1],top[0],top[2]].filter(Boolean);
  let h=`<section class="recap"><p class="eyebrow">${weekName(w)} recap</p><div class="podium3">${order.map(r=>`<div class="pd pd${r.place}" style="--c:${esc(r.p.color)}"><span class="jersey av-${r.p.id}">${initial(r.p)}</span><b>${esc(r.p.name)}</b><small class="num">${r.right}–${r.wrong}</small><div class="pd-step"><span>${PLACE_LABEL[r.place-1]}</span><em class="num">+${r.pts}</em></div></div>`).join('')}</div><ul class="hl">`;
  let best=null;
  for(const g of games){
    const right=ps.filter(p=>picksFor(w,p.id)[g.id]===g.w);
    if(right.length&&right.length<ps.length&&(!best||right.length<best.right.length))best={g,right};
  }
  if(best){
    const t=best.g.w===best.g.a.ab?best.g.a:best.g.h,o=t===best.g.a?best.g.h:best.g.a;
    h+=item(BADGE.perfect,'Best pick',best.right.length===1?`${esc(best.right[0].name)} was the only one to take the ${esc(t.name)} over the ${esc(o.name)}`:`${names(best.right)} took the ${esc(t.name)} over the ${esc(o.name)}`);
  }
  let up=null;
  for(const g of games){const f=lines[g.id];if(f&&f.fav&&f.fav!==g.w&&(!up||(f.line||0)>(up.f.line||0)))up={g,f}}
  if(up){
    const t=up.g.w===up.g.a.ab?up.g.a:up.g.h,o=t===up.g.a?up.g.h:up.g.a;
    const called=ps.filter(p=>picksFor(w,p.id)[up.g.id]===up.g.w);
    h+=item(BADGE.upset,'Biggest upset',`The ${esc(t.name)} beat the favored ${esc(o.name)}${up.f.line?` (+${up.f.line})`:''} · ${called.length?`called by ${names(called)}`:'nobody saw it coming'}`);
  }
  if(sc.actual!==null){
    const guessed=sc.rows.filter(r=>r.tb!==null);
    if(guessed.length){
      const c=guessed.reduce((a,b)=>Math.abs(b.tb-sc.actual)<Math.abs(a.tb-sc.actual)?b:a);
      h+=item(BADGE.wizard,'Closest tiebreaker',`${esc(c.p.name)} guessed ${c.tb}; the final total was ${sc.actual}`);
    }
  }
  const last=sc.rows[sc.rows.length-1];
  h+=item(BADGE.spoon,'Wooden Spoon',`${esc(last.p.name)} takes home the spoon at ${last.right}–${last.wrong}. There’s always next week.`);
  return h+'</ul></section>';
}

let chartModel=null;
function seasonChart(stats,done){
  const ps=players(),W=Math.round(Math.max(260,Math.min(720,((document.getElementById('app')||{}).clientWidth||360)-30))),H=216,m={l:30,r:40,t:22,b:26};
  const series=ps.map(p=>{let t=0;return {p,vals:[0,...done.map(k=>t+=((stats[p.id].weeks[k]||{}).pts||0))]}});
  const maxV=Math.max(3,...series.flatMap(x=>x.vals)),step=maxV<=6?1:maxV<=15?3:maxV<=30?5:10,top=Math.ceil(maxV/step)*step;
  const n=done.length,px=(i)=>m.l+i*(W-m.l-m.r)/n,py=(v)=>m.t+(1-v/top)*(H-m.t-m.b);
  let svg=`<svg class="chart-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Season points after each week">`;
  for(let v=0;v<=top;v+=step)svg+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${py(v)}" y2="${py(v)}"/><text class="axis" x="${m.l-8}" y="${py(v)+4}" text-anchor="end">${v}</text>`;
  const every=n>12?3:n>6?2:1;
  for(let i=0;i<=n;i++)if(i===0||i===n||i%every===0)svg+=`<text class="axis" x="${px(i)}" y="${H-8}" text-anchor="${i===0?'start':i===n?'end':'middle'}">${i===0?'Start':'Wk '+done[i-1]}</text>`;
  svg+=`<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" visibility="hidden"/>`;
  [...series].sort((a,b)=>a.vals[n]-b.vals[n]).forEach(x=>{
    svg+=`<path d="${x.vals.map((v,i)=>`${i?'L':'M'}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${esc(x.p.color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    x.vals.forEach((v,i)=>{if(i)svg+=`<circle class="dot" cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="4" fill="${esc(x.p.color)}"/>`});
  });
  // Initials at the line ends, nudged apart so tied lines stay identifiable without relying on color
  const ends=[...series].sort((a,b)=>b.vals[n]-a.vals[n]).map(x=>({x,y:py(x.vals[n])}));
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<17)ends[i].y=ends[i-1].y+17;
  const overflow=ends.length?ends[ends.length-1].y-(H-m.b):0;
  if(overflow>0)ends.forEach(e=>e.y-=overflow);
  ends.forEach(({x,y})=>{
    const ex=px(n)+18;
    svg+=`<line class="leader" x1="${(px(n)+5).toFixed(1)}" y1="${py(x.vals[n]).toFixed(1)}" x2="${(ex-8).toFixed(1)}" y2="${y.toFixed(1)}"/><circle cx="${ex}" cy="${y.toFixed(1)}" r="8" fill="${esc(x.p.color)}" class="dot"/><text class="endlbl" x="${ex}" y="${(y+3.5).toFixed(1)}" text-anchor="middle">${initial(x.p)}</text>`;
  });
  svg+='</svg>';
  chartModel={px:Array.from({length:n+1},(_,i)=>px(i)),labels:['Start',...done.map(k=>weekName(k))],series:series.map(x=>({name:x.p.name,color:x.p.color,vals:x.vals}))};
  const legend=[...series].sort((a,b)=>b.vals[n]-a.vals[n]).map(x=>`<span class="lgd"><span class="jersey mini av-${x.p.id}" style="--c:${esc(x.p.color)}">${initial(x.p)}</span>${esc(x.p.name)} <b class="num">${x.vals[n]}</b></span>`).join('');
  return `<div class="chart-legend">${legend}</div><div class="chart" data-chart>${svg}<div class="chart-tip" hidden></div></div>`;
}
function chartHover(e){
  const box=e.target.closest('[data-chart]');if(!box||!chartModel)return;
  const svg=box.querySelector('svg'),r=svg.getBoundingClientRect(),vw=svg.viewBox.baseVal.width;
  const x=(e.clientX-r.left)*vw/r.width;
  let i=0,best=Infinity;chartModel.px.forEach((p,k)=>{const d=Math.abs(p-x);if(d<best){best=d;i=k}});
  const cross=svg.querySelector('.cross');cross.setAttribute('x1',chartModel.px[i]);cross.setAttribute('x2',chartModel.px[i]);cross.setAttribute('visibility','visible');
  const tip=box.querySelector('.chart-tip');
  tip.innerHTML=`<b>${i?'After '+esc(chartModel.labels[i]):'Start of the season'}</b>`+[...chartModel.series].sort((a,b)=>b.vals[i]-a.vals[i]).map(x=>`<span><i style="background:${esc(x.color)}"></i>${esc(x.name)}<b class="num">${x.vals[i]}</b></span>`).join('');
  tip.hidden=false;

  tip.style.left=Math.max(0,Math.min(at>box.clientWidth/2?at-tip.offsetWidth-12:at+12,box.clientWidth-tip.offsetWidth))+'px';
}

const UNLOCK_MS=10*60e3;
let pin={pid:null,mode:'enter',entry:'',first:'',why:'',action:null,fails:0,blockedUntil:0,busy:false};
function unlockInfo(){try{return JSON.parse(store.get('unlock')||'null')}catch{return null}}
function isUnlocked(pid){const u=unlockInfo();return !!u&&u.pid===pid&&u.until>Date.now()}
function setUnlocked(pid){store.set('unlock',JSON.stringify({pid,until:Date.now()+UNLOCK_MS}))}

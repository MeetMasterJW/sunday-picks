<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunday Picks">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<title>Sunday Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{
  --bg:#0A0C0F;--surface:#14171C;--raised:#1C2027;--line:#242933;--line-2:#323946;
  --ink:#F4F6F8;--ink-2:#A8B0BC;--ink-3:#6E7785;
  --accent:#FF6A2B;--good:#30D158;--bad:#FF453A;--live:#FF453A;
  --radius:18px;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(10,12,15,.8);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:grid;gap:0}
.brand{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center}
.brand b{color:var(--accent);font-weight:800}
.top-in:has(.weeknav[hidden]) .brand{font-size:20px;font-weight:800;color:var(--ink);padding:10px 0}
.weeknav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.nav{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.nav:disabled{opacity:.25;cursor:default}
.nav svg,.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wk{text-align:center;line-height:1.15}
.wk b{display:block;font-size:22px;font-weight:800;font-stretch:88%;letter-spacing:-.01em}
.wk span{font-size:12.5px;color:var(--ink-2)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(14,16,20,.86);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--ink-3);border-radius:12px}
.tabs button[aria-selected="true"]{color:var(--accent)}
@media (min-width:760px){
  .tabs{left:50%;right:auto;width:480px;transform:translateX(-50%);bottom:16px;border:1px solid var(--line);border-radius:22px;padding:6px}
  body{padding-bottom:110px}
}

main{max-width:760px;margin:0 auto;padding:14px 12px 24px;display:grid;gap:12px}
main>*{min-width:0}
.eyebrow{margin:0;font-size:13px;font-weight:700;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:14px;margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--raised);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px}
.empty{text-align:center;padding:48px 12px;color:var(--ink-2)}
.jersey{border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-weight:800;width:34px;height:34px;font-size:15px;flex:none}

/* who is picking */
.pickers{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:2px 12px}
.pickers::-webkit-scrollbar{display:none}
.pk{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px}
.pk .jersey{width:30px;height:30px;font-size:13px}
.pk .nm{font-weight:700;font-size:14px}
.pk .ct{font-size:12px;color:var(--ink-3)}
.pk[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.pk[aria-pressed="true"] .ct{color:var(--ink)}
.note,.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;color:var(--ink-2)}
.note b{color:var(--ink)}
.lockbar{flex-wrap:nowrap;padding-left:8px}
.lockbar .lb-text{flex:1}
.lockbar .toggle,.note .toggle{padding:6px 12px}
.pill{font-size:11px;font-weight:700;background:var(--raised);color:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px}

/* games */
.day{display:grid;gap:10px}
.dayhead{margin:8px 4px 0}
.dayhead h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.slot{font-size:10px;font-weight:800;background:var(--accent);color:#fff;border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px 8px;display:grid;gap:6px}
.game.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}}
.gmeta{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;padding:2px 6px 0;font-size:12.5px;color:var(--ink-3)}
.gmeta .line{font-weight:600;color:var(--ink-2)}
.st{font-weight:600;color:var(--ink-2)}
.st.final{color:var(--ink)}
.st.live{color:var(--live)}
.st.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.rows{display:grid;gap:4px}
.team{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:var(--raised);border-radius:14px;padding:8px 12px 8px 8px;min-height:58px}
.team .logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 75%,transparent) 0,color-mix(in srgb,var(--tc) 30%,transparent) 55%,transparent 71%)}
.team .logo img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.team .logo .ab{font-weight:800;font-size:12px}
.tn{min-width:0;display:grid}
.tn b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.tag{font-style:normal;font-weight:700}
.up .tag,.ok .tag{color:var(--good)}
.down .tag,.no .tag{color:var(--bad)}
.even .tag{color:var(--ink-2)}
.sc{font-size:30px;font-weight:800;font-stretch:78%;min-width:1.6ch;text-align:right;color:var(--ink-3);line-height:1}
.team.ahead .sc,.team.won .sc{color:var(--ink)}
.team.lost .tn b,.team.behind .tn b{color:var(--ink-2)}
.team.lost .logo{opacity:.5}
.sc.bump{animation:bump 1.4s ease-out}
@keyframes bump{0%{transform:scale(1.45);color:var(--accent)}55%{transform:scale(1);color:var(--accent)}}
.pickmark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.team.mine .pickmark{border-color:var(--me);background:var(--me)}
.team.mine .pickmark::after{content:"✓";color:#fff;font-size:13px;font-weight:800;line-height:1}
.team.mine{border-color:color-mix(in srgb,var(--me) 75%,transparent);background:color-mix(in srgb,var(--me) 16%,var(--raised))}
.team.mine.up,.team.mine.ok{border-color:color-mix(in srgb,var(--good) 70%,transparent);background:color-mix(in srgb,var(--good) 13%,var(--raised))}
.team.mine.down,.team.mine.no{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--raised))}
.team[aria-disabled="true"]{cursor:default}
.pips{display:flex;align-items:center}
.pip{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;box-shadow:0 0 0 2px var(--raised)}
.pips{gap:3px}
.pip.up,.pip.ok{box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px var(--good)}
.pip.down{box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px var(--bad)}
.pip.no{opacity:.4}
.sealed{margin:0 6px 2px;font-size:12px;color:var(--ink-3)}
.tb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:2px;padding:10px 6px 4px;font-size:14px;color:var(--ink-2)}
.tb b{color:var(--ink)}
.tb input{width:80px;font:800 20px var(--font);text-align:center;padding:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
.tb input:focus{outline:none;border-color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.guess{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
@media (hover:hover){.team:not([aria-disabled="true"]):hover,.pk:hover{border-color:var(--line-2)}}
@media (prefers-reduced-motion:no-preference){.team,.pk{transition:background-color .15s,border-color .15s,transform .1s}.team:active:not([aria-disabled="true"]),.pk:active{transform:scale(.985)}}

/* tables */
.scroll{overflow-x:auto;margin:10px -14px -14px;padding:0 14px 12px}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{padding:9px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--ink-3)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.win{color:var(--accent);font-weight:800}
td.tot{font-weight:800;font-size:16px}
.rk{display:inline-block;min-width:18px;color:var(--ink-3);font-weight:700}
.allpicks th{vertical-align:bottom;min-width:64px}
.allpicks th small{display:block;font-size:12px;color:var(--ink-2)}
.allpicks .jersey{width:28px;height:28px;font-size:13px;margin:0 auto 4px;display:grid}
.gcell b{display:block;font-weight:700}
.gcell span{display:block;font-size:12px;color:var(--ink-3)}
.pchip{display:inline-block;min-width:44px;padding:4px 6px;border-radius:8px;background:var(--tc);color:var(--tx);font-size:12px;font-weight:800}
td.ok{background:color-mix(in srgb,var(--good) 16%,transparent)}
td.up{background:color-mix(in srgb,var(--good) 8%,transparent)}
td.down{background:color-mix(in srgb,var(--bad) 8%,transparent)}
td.no .pchip{opacity:.4}
.mark{font-style:normal;font-weight:800;margin-left:4px;font-size:11px}
td.ok .mark,td.up .mark{color:var(--good)}
td.no .mark,td.down .mark{color:var(--bad)}
td.none,td.sealedc{color:var(--ink-3)}
.tbrow td{border-top:1px solid var(--line-2);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:12px;font-weight:600}
.lg.ok,.lg.up{color:var(--good)}
.lg.no,.lg.down{color:var(--bad)}
.upct{color:var(--good)}

/* standings */
.champ{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 28%,var(--surface)),var(--surface) 72%);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center}
.trophy{font-size:34px;color:var(--accent);line-height:1}
.champ h3{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.champ .eyebrow{color:var(--ink-2)!important;opacity:1!important}
.podium{display:flex;flex-wrap:wrap;gap:2px 14px;margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.podium b{color:var(--accent)}
.rank{display:grid;margin-top:4px}
.rrow{display:grid;grid-template-columns:20px 34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.pos{font-weight:800;color:var(--ink-3);text-align:center}
.who b{display:block;font-weight:700;font-size:16px}
.who span{font-size:12.5px;color:var(--ink-3)}
.rec{font-size:28px;font-weight:800;font-stretch:78%;text-align:right;line-height:1}
.rec small{display:block;font-size:11px;font-weight:600;color:var(--ink-3);font-stretch:100%;margin-top:3px}
.ptsb{color:var(--accent);font-weight:800;font-size:12px}
.crown{color:var(--accent)}
.rules{padding:0 4px}
.rules summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2);padding:6px 0}
.rules p{margin:4px 0 0}

/* family */
.frow{display:grid;grid-template-columns:34px 1fr;gap:10px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow input{width:100%;font:600 16px var(--font);padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
.frow input:focus{outline:none;border-color:var(--accent)}
.sw{grid-column:2;display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:0;background:var(--c)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.setrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}

/* alerts, dialog, toast */
.alert{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:8;width:min(440px,calc(100% - 20px));border:0;border-radius:22px;padding:14px 16px 18px;color:#fff;cursor:pointer;overflow:hidden;text-align:left;font:inherit;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 78%,#000),color-mix(in srgb,var(--tc) 38%,#000));box-shadow:0 20px 50px -16px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.1)}
.alert::after{content:"";position:absolute;left:16px;right:16px;bottom:8px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);transform-origin:left}
.alert.in{animation:alertIn .5s cubic-bezier(.2,1.25,.4,1)}
.alert.in::after{animation:alertTimer 6s linear forwards}
@keyframes alertIn{from{transform:translate(-50%,-140%)}to{transform:translate(-50%,0)}}
@keyframes alertTimer{to{transform:scaleX(0)}}
.al-head{display:flex;align-items:center;gap:10px}
.al-logo{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.16);padding:5px;object-fit:contain}
.al-kind{font-size:20px;font-weight:800;letter-spacing:-.01em}
.al-meta{margin-left:auto;font-size:12px;font-weight:600;opacity:.8;white-space:nowrap}
.al-score{display:flex;gap:10px;align-items:baseline;font-size:34px;font-weight:800;font-stretch:78%;margin-top:6px;line-height:1}
.al-score .lo{opacity:.5}
.al-people{margin-top:8px;font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}
.al-people b{font-weight:800}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
dialog{border:1px solid var(--line-2);border-radius:22px;padding:20px;width:calc(100% - 32px);max-width:360px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h3{margin:0;font-size:20px;font-weight:800}
dialog p{margin:6px 0 0}
#parentPw{width:100%;margin-top:14px;font:600 17px var(--font);padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
#parentPw:focus{outline:none;border-color:var(--accent)}
.keep{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.dlgbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}

@media (max-width:520px){
  .team{gap:10px;padding:7px 10px 7px 7px}
  .tn b{font-size:15px}
  .sc{font-size:28px}
  .allpicks{width:100%;table-layout:fixed;font-size:12px}
  .allpicks th,.allpicks td{padding:6px 2px;white-space:normal}
  .allpicks th:first-child,.allpicks td:first-child{width:86px;padding-left:0}
  .allpicks th{min-width:0}
  .allpicks .pname{display:none}
  .allpicks th small{font-size:10px}
  .allpicks th .upct{display:block}
  .allpicks .jersey{width:24px;height:24px;font-size:12px}
  .gcell b{font-size:12px}
  .gcell span{font-size:10px;line-height:1.25}
  .pchip{min-width:0;width:100%;padding:3px 0;font-size:11px;text-align:center}
  .allpicks .mark{display:block;margin:1px 0 0;font-size:9px;text-align:center}
}
@media (prefers-reduced-motion:reduce){.alert.in,.alert.in::after,.sc.bump,.game.flash,.st.live::before{animation:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="brand">Sunday <b>Picks</b></span>
    <div class="weeknav">
      <button id="prev" class="nav" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="wk"><b id="wkTitle">Week –</b><span id="wkDates">Loading schedule…</span></div>
      <button id="next" class="nav" aria-label="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</header>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="picks" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>Picks</span></button>
  <button role="tab" data-tab="all" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>All picks</span></button>
  <button role="tab" data-tab="standings" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h8M12 16v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4.5a2.5 2.5 0 002.8 3.6M17 6h2.5a2.5 2.5 0 01-2.8 3.6"/></svg><span>Standings</span></button>
  <button role="tab" data-tab="family" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M3 19.5a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.4"/><path d="M16.2 14a4.6 4.6 0 015.3 5.5"/></svg><span>Family</span></button>
</nav>
<main id="app"><div class="empty">Loading…</div></main>
<div class="alert" id="alert" role="status" aria-live="polite" hidden></div>
<div class="toast" id="toast" hidden></div>
<dialog id="parentDlg" aria-labelledby="parentTitle">
  <form id="parentForm">
    <h3 id="parentTitle">Parent password</h3>
    <p class="muted" id="parentWhy"></p>
    <input type="email" id="parentUser" autocomplete="username" hidden>
    <input type="password" id="parentPw" autocomplete="current-password" aria-label="Parent password" required>
    <label class="keep"><input type="checkbox" id="parentKeep"> Keep a parent signed in on this device</label>
    <p class="err" id="parentErr" hidden></p>
    <div class="dlgbtns"><button type="button" class="toggle" id="parentCancel">Cancel</button><button type="submit" class="primary" id="parentGo">Continue</button></div>
  </form>
</dialog>

<script type="module">
import {firebaseConfig,parentEmail} from './config.js';
import {fetchWeek,groupIntoPickWeeks} from './espn.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,collection,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const COLORS=['#E8641E','#2E6FD8','#C23B6B','#1E9E8A','#7B4FC9','#D9432B','#B71C1C','#AD1457','#E0457B','#A43BB5','#5B5BD6','#1565C0','#1B8FD1','#0F8C9E','#2F8F3A','#558B2F','#8A7A12','#C9A200','#D98200','#A0522D','#6D4C41','#4A5560','#37474F','#2B2F36'];
const DEFAULT_FAMILY={players:[1,2,3,4,5].map((i)=>({id:'p'+i,name:'Player '+i,color:COLORS[i-1]}))};
const S={db:null,auth:null,parent:false,family:DEFAULT_FAMILY,weeks:{},picks:{},locks:{},week:null,me:'p1',tab:'picks',results:false,ready:false,offline:false};
const $=(s)=>document.querySelector(s);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
S.me=store.get('picker')||'p1';S.tab=store.get('tab')||'picks';

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
function textOn(hex){const h=hex.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);return (.2126*r+.7152*g+.0722*b)>.45?'#111':'#fff'}
function players(){return (S.family.players||DEFAULT_FAMILY.players).slice(0,5)}
function player(id){return players().find(p=>p.id===id)||players()[0]}
function initial(p){return esc((p.name||'?').trim().charAt(0).toUpperCase())}
// Late-pick days (Eastern date -> minutes after kickoff that picks stay open)
const LATE_PICKS={'2026-09-13':60};
const etDate=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
function lockTime(g){const t=new Date(g.t);return t.getTime()+(LATE_PICKS[etDate.format(t)]||0)*60e3}
// Who a pick is tracking: final result, or the current leader while a game is live
function pickState(g,pick){
  if(!pick)return '';
  if(g.w)return g.w==='TIE'?'':(pick===g.w?'ok':'no');
  if(g.st!=='in')return '';
  if(g.as===g.hs)return 'even';
  return pick===(g.as>g.hs?g.a.ab:g.h.ab)?'up':'down';
}
function weekLocked(w=S.week){return !!(S.locks['w'+w]&&S.locks['w'+w].locked)}
function locked(g,w=S.week){return weekLocked(w)||g.st==='post'||!!g.w||Date.now()>=lockTime(g)}
function pickDoc(week,pid){return S.picks['w'+week+'-'+pid]||{week,player:pid,picks:{}}}
function picksFor(week,pid){return pickDoc(week,pid).picks||{}}
function weekGames(w){return (S.weeks[w]||{}).games||[]}

const fmtDay=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric'});
const fmtShort=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'});
const fmtTime=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'});
const etParts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',hour12:false});
function slotLabel(g){
  if(g.tbd)return '';
  const p=Object.fromEntries(etParts.formatToParts(new Date(g.t)).map(x=>[x.type,x.value]));
  const h=+p.hour;
  if(p.weekday==='Thu'&&h>=19)return 'TNF';
  if(p.weekday==='Sun'&&h>=20)return 'SNF';
  if(p.weekday==='Mon'&&h>=19)return 'MNF';
  return '';
}

/* ---- scoring ---- */
// Week points by final place: 1st, 2nd, 3rd
const PLACE_POINTS=[3,2,1];
const PLACE_LABEL=['1st','2nd','3rd','4th','5th'];
/* Weekly order: most correct picks, then closest guess of total points in the
   week's last game, then a guess that isn't over, then whoever saved their guess first. */
function weekScore(w){
  const games=weekGames(w);const done=games.filter(g=>g.w);
  const last=games[games.length-1];
  const actual=last&&last.w?last.as+last.hs:null;
  const rows=players().map((p,idx)=>{
    const doc=pickDoc(w,p.id),pk=doc.picks||{};let right=0,wrong=0,made=0,up=0;
    games.forEach(g=>{if(pk[g.id])made++;if(pickState(g,pk[g.id])==='up')up++});
    done.forEach(g=>{if(g.w==='TIE')return; if(pk[g.id]===g.w)right++; else wrong++});
    return {p,right,wrong,made,up,idx,tb:typeof doc.tb==='number'?doc.tb:null,tbAt:doc.tbAt||'9999'};
  });
  const complete=games.length>0&&done.length===games.length;
  const tiebreak=(a,b)=>{
    if(actual===null)return 0;
    if((a.tb===null)!==(b.tb===null))return a.tb===null?1:-1;
    if(a.tb!==null){
      const d=Math.abs(a.tb-actual)-Math.abs(b.tb-actual);if(d)return d;
      const oa=a.tb>actual,ob=b.tb>actual;if(oa!==ob)return oa?1:-1;
    }
    return a.tbAt<b.tbAt?-1:a.tbAt>b.tbAt?1:a.idx-b.idx;
  };
  rows.sort((a,b)=>b.right-a.right||(complete?tiebreak(a,b):a.wrong-b.wrong||a.idx-b.idx));
  rows.forEach((r,i)=>{
    r.place=i+1;
    r.pts=complete?(PLACE_POINTS[i]||0):0;
    r.tied=rows.some(x=>x!==r&&x.right===r.right);
  });
  const top=Math.max(...rows.map(r=>r.right));
  rows.forEach(r=>r.lead=done.length>0&&r.right===top&&top>0);
  const winner=complete?rows[0]:null;
  const byTiebreak=!!winner&&rows.filter(r=>r.right===winner.right).length>1;
  return {rows,winner,byTiebreak,actual,last,complete,done:done.length,total:games.length,top};
}
function currentWeek(){
  const now=Date.now();
  for(let w=1;w<=18;w++){const gs=weekGames(w);if(!gs.length)continue;
    const last=Math.max(...gs.map(g=>new Date(g.t).getTime()));
    if(last+12*3600e3>now||gs.some(g=>!g.w))return w;}
  return 18;
}

/* ---- rendering ---- */
function render(){
  const w=S.week;
  $('#prev').disabled=!w||w<=1;$('#next').disabled=!w||w>=18;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const gs=weekGames(w);
  $('#wkTitle').textContent=S.tab==='family'?'Family':(S.tab==='standings'&&!w?'Standings':'Week '+(w||'–'));
  if(S.tab==='family'){$('#wkDates').textContent='Names & colors'}
  else if(gs.length){const a=new Date(gs[0].t),b=new Date(gs[gs.length-1].t);$('#wkDates').textContent=fmtShort.format(a)+' – '+fmtShort.format(b)+' · '+gs.length+' games'+(S.scoreError?' · scores offline':'')}
  else $('#wkDates').textContent=S.ready?'Schedule not loaded yet':'Loading schedule…';
  $('.weeknav').hidden=S.tab==='family';
  const app=$('#app');
  if(S.offline){app.innerHTML='<div class="empty"><b>Sunday Picks isn’t connected to its database yet.</b><br>Add your Firebase settings to config.js.</div>';return}
  if(S.tab==='family')return renderFamily(app);
  if(!gs.length){app.innerHTML='<div class="empty">'+(S.ready?'No games found for this week yet.':'Loading the schedule…')+'</div>';return}
  if(S.tab==='standings')return renderStandings(app);
  if(S.tab==='all')return renderAllPicks(app);
  renderPicks(app);
}

// Everyone has picked every game they still can (and set a tiebreaker while it's open)
function allSubmitted(w){
  const gs=weekGames(w);if(!gs.length)return false;
  const now=Date.now(),last=gs[gs.length-1];
  return players().every(p=>{
    const d=pickDoc(w,p.id),pk=d.picks||{};
    return gs.every(g=>pk[g.id]||g.w||now>=lockTime(g))&&(typeof d.tb==='number'||now>=lockTime(last));
  });
}
// Lock a week automatically once all picks are in. A week with any lock record
// (including one someone unlocked by hand) is left alone.
function maybeAutoLock(){
  if(!S.db||!S.ready||!S.picksLoaded||!S.locksLoaded)return;
  for(let w=1;w<=18;w++){
    const key='w'+w;
    if(S.locks[key]||!allSubmitted(w))continue;
    S.locks={...S.locks,[key]:{week:w,locked:true,auto:true,at:new Date().toISOString()}};
    S.db.doc('locks/'+key).set(S.locks[key]).then(()=>toast(`Everyone’s picks are in. Week ${w} is locked.`)).catch(()=>{const n={...S.locks};delete n[key];S.locks=n;render()});
    render();
  }
}

function setLock(w,locked){
  const key='w'+w,prev=S.locks[key];
  S.locks={...S.locks,[key]:{week:w,locked,at:new Date().toISOString()}};render();
  return S.db.doc('locks/'+key).set(S.locks[key])
    .then(()=>toast(locked?`Week ${w} picks locked`:`Week ${w} picks unlocked`))
    .catch(()=>{S.locks={...S.locks,[key]:prev};render();toast(locked?'The lock didn’t save. Try again.':'Only a parent can unlock picks.')});
}

/* ---- parent controls ---- */
let afterParent=null;
function requireParent(why,action){
  if(S.parent){action();return}
  if(!S.auth){toast('Parent sign-in isn’t available right now.');return}
  afterParent=action;
  $('#parentWhy').textContent=why;
  $('#parentErr').hidden=true;
  $('#parentPw').value='';
  $('#parentKeep').checked=false;
  $('#parentDlg').showModal();
  $('#parentPw').focus();
}
function signInError(code){
  if(code==='auth/too-many-requests')return 'Too many tries. Wait a few minutes, then try again.';
  if(code==='auth/network-request-failed')return 'No connection. Check your internet and try again.';
  if(code==='auth/operation-not-allowed'||code==='auth/configuration-not-found')return 'Parent sign-in isn’t turned on in Firebase yet.';
  return 'That password didn’t work. Try again.';
}
$('#parentUser').value=parentEmail||'';
$('#parentCancel').addEventListener('click',()=>{afterParent=null;$('#parentDlg').close()});
$('#parentForm').addEventListener('submit',async(e)=>{
  e.preventDefault();e.stopPropagation();
  const go=$('#parentGo');go.disabled=true;
  try{
    await signInWithEmailAndPassword(S.auth,parentEmail,$('#parentPw').value);
    const keep=$('#parentKeep').checked,action=afterParent;
    afterParent=null;$('#parentPw').value='';$('#parentDlg').close();
    try{if(action)await action()}
    finally{if(!keep)await signOut(S.auth)}
  }catch(err){
    $('#parentErr').textContent=signInError(err&&err.code);$('#parentErr').hidden=false;
  }finally{go.disabled=false}
});

function lockButton(w){
  return `<button class="toggle" id="lockToggle" aria-pressed="${weekLocked(w)}">${weekLocked(w)?'Unlock':'Lock all picks'}</button>`;
}

function renderPicks(app){
  const w=S.week,gs=weekGames(w),me=player(S.me),mine=picksFor(w,me.id);
  const sc=weekScore(w);
  const allLocked=gs.length>0&&gs.every(g=>locked(g));
  let h='';
  if(!allLocked){
  h+='<div class="pickers" role="group" aria-label="Who is picking">';
  players().forEach(p=>{
    const n=Object.keys(picksFor(w,p.id)).filter(id=>gs.some(g=>g.id===id)).length;
    h+=`<button class="pk" style="--c:${esc(p.color)}" data-picker="${esc(p.id)}" aria-pressed="${p.id===me.id}"><span class="jersey">${initial(p)}</span><span class="nm">${esc(p.name)}</span><span class="ct num">${n}/${gs.length}</span></button>`;
  });
  h+='</div>';
  }
  const open=gs.filter(g=>!locked(g)&&!mine[g.id]).length;
  const defaults=players().every(p=>/^Player \d$/.test(p.name));
  const status=S.results?'<b>Entering results.</b> Tap the team that won each game.'
    :weekLocked(w)?`<b>${S.locks['w'+w].auto?`Everyone’s picks are in, so Week ${w} is locked.`:`Picks are locked for Week ${w}.`}</b> Everyone’s picks now show.`
    :`<b>${esc(me.name)}</b> is picking · ${open?`<span class="num">${open}</span> open game${open>1?'s':''} left`:'all set for this week'}`;
  if(allLocked)h+=`<div class="lockbar"><span class="pill">Locked</span><span class="lb-text">${weekLocked(w)&&S.locks['w'+w].auto?'Everyone’s picks are in.':'Picks are closed for this week.'}</span>${weekLocked(w)?lockButton(w):''}</div>`;
  else h+=`<div class="note"><span>${status}</span>
      <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${defaults&&!S.results?'<button class="linkbtn" data-tab="family">Add your names</button>':''}${S.results?'':lockButton(w)}</span></div>`;

  let lastDay='';
  gs.forEach(g=>{
    const d=new Date(g.t),day=g.tbd?'Week '+w+' · Date TBD':fmtDay.format(d);
    if(day!==lastDay){if(lastDay)h+='</section>';h+=`<section class="day"><div class="dayhead"><h2>${esc(day)}</h2></div>`;lastDay=day}
    h+=gameCard(g,w,me,mine,g===gs[gs.length-1]);
  });
  h+='</section>';
  app.innerHTML=h;
  app.classList.toggle('resultmode',S.results);
}

function teamBtn(g,side,me,mine,pips){
  const t=g[side],isMine=mine[g.id]===t.ab,won=g.w===t.ab,lost=g.w&&g.w!=='TIE'&&!won;
  const live=!g.w&&g.st==='in',mineState=isMine?pickState(g,t.ab):'';
  const ahead=live&&(side==='a'?g.as>g.hs:g.hs>g.as),behind=live&&(side==='a'?g.as<g.hs:g.hs<g.as);
  const cls=['team',isMine?'mine':'',mineState,won?'won':'',lost?'lost':'',behind?'behind':'',ahead?'ahead':''].join(' ');
  const tag=mineState==='up'?'Winning':mineState==='down'?'Losing':mineState==='even'?'Tied':mineState==='ok'?'Right':mineState==='no'?'Wrong':'';
  const started=g.st!=='pre'||!!g.w;
  return `<button class="${cls}" style="--tc:${esc(t.c)};--me:${esc(me.color)}" data-game="${esc(g.id)}" data-team="${esc(t.ab)}" ${locked(g)?'aria-disabled="true"':''} aria-pressed="${isMine}" aria-label="${esc(t.loc+' '+t.name+(t.rec?', '+t.rec:''))}">
    <span class="logo">${t.logo?`<img src="${esc(t.logo)}" alt="" width="30" height="30" loading="lazy">`:`<span class="ab">${esc(t.ab)}</span>`}</span>
    <span class="tn"><b>${esc(t.name)}</b><span class="sub">${tag?`<em class="tag">${tag}</em>`:`<span class="num">${esc(t.rec||t.loc)}</span>`}</span></span>
    <span class="pips">${pips||''}</span>
    ${started?`<span class="sc num${flashing(g,side)?' bump':''}">${side==='a'?g.as:g.hs}</span>`:'<span class="pickmark" aria-hidden="true"></span>'}
  </button>`;
}

function tiebreakRow(g,w,me){
  if(!locked(g)){
    const tb=pickDoc(w,me.id).tb;
    return `<label class="tb"><span><b>Tiebreaker</b> · ${esc(me.name)}, how many total points will both teams score?</span><input type="number" min="0" max="150" inputmode="numeric" data-tb="${esc(g.id)}" value="${typeof tb==='number'?tb:''}" placeholder="45" aria-label="Tiebreaker guess for ${esc(me.name)}"></label>`;
  }
  const guesses=players().map(p=>{const tb=pickDoc(w,p.id).tb;return `<span class="guess"><span class="pip" style="--c:${esc(p.color)}" title="${esc(p.name)}" aria-label="${esc(p.name)}">${initial(p)}</span>${typeof tb==='number'?tb:'–'}</span>`}).join('');
  return `<div class="tb"><span><b>Tiebreaker guesses</b>${g.w?` · final total <b class="num">${g.as+g.hs}</b>`:''}</span><div class="dots">${guesses}</div></div>`;
}

// Spreads disappear from the feed at kickoff, so remember the last one seen on this device
const spreads=(()=>{try{return JSON.parse(store.get('spreads')||'{}')}catch{return {}}})();
function spreadText(g){
  if(g.spread&&(!spreads[g.id]||spreads[g.id].s!==g.spread||spreads[g.id].ou!==g.ou)){
    spreads[g.id]={s:g.spread,ou:g.ou};store.set('spreads',JSON.stringify(spreads));
  }
  const sp=g.spread?{s:g.spread,ou:g.ou}:spreads[g.id];
  return sp?`${sp.s}${sp.ou!=null?' · O/U '+sp.ou:''}`:`${g.a.ab} @ ${g.h.ab}`;
}

function gameCard(g,w,me,mine,isLast){
  const lk=locked(g),slot=slotLabel(g);
  let status;
  if(g.w)status=`<span class="st final">${g.w==='TIE'?'Final · Tie':'Final'}</span>`;
  else if(g.st==='in')status=`<span class="st live">${esc(g.d||'Live')}</span>`;
  else if(Date.now()>=new Date(g.t).getTime())status=`<span class="st live">Kicked off${lk?'':' · picks open until '+fmtTime.format(new Date(lockTime(g)))}</span>`;
  else status=`<span class="st">${g.tbd?'Time TBD':fmtTime.format(new Date(g.t))}${slot?`<span class="slot">${slot}</span>`:''}${lk&&!weekLocked(w)?' · locked':''}</span>`;
  const who=players().map(p=>({p,pick:picksFor(w,p.id)[g.id]})).filter(x=>x.pick);
  const pips=(ab)=>lk?who.filter(x=>x.pick===ab).map(x=>`<span class="pip ${pickState(g,x.pick)}" style="--c:${esc(x.p.color)}" title="${esc(x.p.name)}" aria-label="${esc(x.p.name)}">${initial(x.p)}</span>`).join(''):'';
  let h=`<article class="game${flashing(g)?' flash':''}"><div class="gmeta">${status}<span class="line">${esc(spreadText(g))}</span></div>
    <div class="rows">${teamBtn(g,'a',me,mine,pips(g.a.ab))}${teamBtn(g,'h',me,mine,pips(g.h.ab))}</div>`;
  if(!lk)h+=`<p class="sealed">${who.length}/${players().length} picked · revealed when picks lock</p>`;
  if(isLast)h+=tiebreakRow(g,w,me);
  return h+'</article>';
}

const fmtKick=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'});
function renderAllPicks(app){
  const w=S.week,gs=weekGames(w),ps=players(),sc=weekScore(w);
  const rec=Object.fromEntries(sc.rows.map(r=>[r.p.id,r]));
  const anyOpen=gs.some(g=>!locked(g));
  let h=`<div class="note"><span>${anyOpen?(S.revealAll?'<b>Showing every pick</b>, including games that haven’t locked yet.':'Picks for games that haven’t locked yet show as ✓ until they lock.'):'Every game this week is locked, so all picks show.'}</span><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${lockButton(w)}${anyOpen?`<button class="toggle" id="revealToggle" aria-pressed="${!!S.revealAll}">${S.revealAll?'Hide open picks':'Show all picks'}</button>`:''}</span></div>`;
  h+=`<section class="card"><div class="scroll" style="margin-top:-6px"><table class="allpicks"><thead><tr><th>Game</th>${ps.map(p=>`<th style="--c:${esc(p.color)}"><span class="jersey">${initial(p)}</span><span class="pname">${esc(p.name)}</span><small class="num">${rec[p.id].right}–${rec[p.id].wrong}${rec[p.id].up?`<span class="upct"> · ${rec[p.id].up} ▲</span>`:''}</small></th>`).join('')}</tr></thead><tbody>`;
  gs.forEach(g=>{
    const show=locked(g)||S.revealAll;
    const status=g.w?(g.w==='TIE'?`Final · tie ${g.as}–${g.hs}`:`Final ${g.as}–${g.hs}`):g.st==='in'?`Live ${g.as}–${g.hs}${g.d?' · '+g.d:''}`:g.tbd?'Time TBD':fmtKick.format(new Date(g.t));
    h+=`<tr><td class="gcell"><b>${esc(g.a.ab)} @ ${esc(g.h.ab)}</b><span class="num">${esc(status)}</span></td>`;
    ps.forEach(p=>{
      const pick=picksFor(w,p.id)[g.id];
      if(!pick){h+='<td class="none" aria-label="No pick">—</td>';return}
      if(!show){h+='<td class="sealedc" aria-label="Picked, hidden until lock">✓</td>';return}
      const t=pick===g.a.ab?g.a:pick===g.h.ab?g.h:{c:'#555555'};
      const res=pickState(g,pick);
      const mark={ok:'<i class="mark" aria-label="correct">✓</i>',no:'<i class="mark" aria-label="wrong">✗</i>',up:'<i class="mark" aria-label="winning now">▲</i>',down:'<i class="mark" aria-label="losing now">▼</i>'}[res]||'';
      h+=`<td class="${res}"><span class="pchip" style="--tc:${esc(t.c)};--tx:${textOn(t.c)}">${esc(pick)}</span>${mark}</td>`;
    });
    h+='</tr>';
  });
  const last=gs[gs.length-1],tbShow=locked(last)||S.revealAll;
  h+=`<tr class="tbrow"><td class="gcell"><b>Tiebreaker</b><span>Total points, ${esc(last.a.ab)} @ ${esc(last.h.ab)}${last.w?' · final '+(last.as+last.hs):''}</span></td>${ps.map(p=>{const tb=pickDoc(w,p.id).tb;return `<td class="num">${typeof tb!=='number'?'—':tbShow?tb:'✓'}</td>`}).join('')}</tr>`;
  h+='</tbody></table></div><p class="legend"><span class="lg ok">✓ Right</span><span class="lg up">▲ Winning now</span><span class="lg down">▼ Losing now</span><span class="lg no">✗ Wrong</span></p></section>';
  app.innerHTML=h;
}

function renderStandings(app){
  const w=S.week,sc=weekScore(w);
  let h='';
  if(sc.complete){
    h+=`<div class="champ"><span class="trophy">★</span><div><p class="eyebrow" style="color:inherit;opacity:.7">Week ${w} final</p><h3>${esc(sc.winner.p.name)} wins the week</h3><p class="podium">${sc.rows.slice(0,3).map(r=>`<span>${PLACE_LABEL[r.place-1]} ${esc(r.p.name)} <b>+${r.pts}</b></span>`).join('')}</p></div></div>`;
  }
  h+=`<section class="card"><p class="eyebrow">Week ${w} · ${sc.complete?'Final':`${sc.done} of ${sc.total} final`}</p><div class="rank">`;
  let pos=0,prev=null;
  sc.rows.forEach((r,i)=>{
    if(sc.complete)pos=r.place; else if(prev===null||r.right!==prev){pos=i+1;prev=r.right}
    if(!sc.done)pos='–';
    const notes=[];
    if(!sc.done)notes.push(`${r.made}/${sc.total} picked`);
    else if(!sc.complete&&r.up)notes.push(`<b class="upct">${r.up} winning now</b>`);
    if(sc.complete&&r.tied)notes.push(`Tiebreaker ${r.tb===null?'—':r.tb}`);
    h+=`<div class="rrow" style="--c:${esc(r.p.color)}"><span class="pos num">${pos}</span><span class="jersey">${initial(r.p)}</span>
      <div class="who"><b>${esc(r.p.name)} ${sc.complete&&r.place===1?'<span class="crown" aria-label="Week winner">★</span>':''}</b>${notes.length?`<span class="num">${notes.join(' · ')}</span>`:''}</div>
      <div class="rec num">${r.right}–${r.wrong}<small>${sc.complete?`<b class="ptsb">+${r.pts} pts</b>`:'W–L'}</small></div></div>`;
  });
  h+='</div></section>';

  // season: total week points only
  const season=players().map(p=>({p,points:0,byWeek:{}}));
  const byId=Object.fromEntries(season.map(x=>[x.p.id,x]));
  const cols=[];
  for(let k=1;k<=18;k++){
    const s2=weekScore(k);if(!s2.complete)continue;
    cols.push(k);
    s2.rows.forEach(r=>{const row=byId[r.p.id];row.points+=r.pts;row.byWeek[k]={pts:r.pts,place:r.place}});
  }
  season.sort((a,b)=>b.points-a.points);
  season.forEach((r,i)=>r.rank=i>0&&r.points===season[i-1].points?season[i-1].rank:i+1);
  const seasonOver=cols.length===18,champs=season.filter(r=>r.rank===1);
  const eyebrow=seasonOver?`Season ${champs.length>1?'co-champions':'champion'} · ${champs.map(r=>esc(r.p.name)).join(' & ')}`:`Season points · ${cols.length} of 18 weeks final`;
  h+=`<section class="card"><p class="eyebrow">${eyebrow}</p><div class="scroll"><table class="num"><thead><tr><th>Player</th><th>Pts</th>${cols.map(k=>`<th>Wk ${k}</th>`).join('')}</tr></thead><tbody>`;
  season.forEach(r=>{
    h+=`<tr><td><span class="rk">${r.rank}</span><b style="color:${esc(r.p.color)}">●</b> ${esc(r.p.name)}${seasonOver&&r.rank===1?' <span class="crown">★</span>':''}</td><td class="tot">${r.points}</td>${cols.map(k=>{const c=r.byWeek[k];return `<td class="${c.place===1?'win':''}">${c.pts}${c.place===1?' ★':''}</td>`}).join('')}</tr>`;
  });
  h+=`</tbody></table></div></section><details class="rules"><summary>How scoring works</summary><p class="muted">Each week ends with a final order by correct picks. 1st place gets 3 points, 2nd gets 2 and 3rd gets 1. If people tie on correct picks, the closest guess of total points in the week’s last game goes ahead, then a guess that didn’t go over, then whoever saved their guess first. Tied NFL games don’t count, and a missed pick counts as a loss. Season standings count points only; people tied on points share the spot.</p></details>`;
  app.innerHTML=h;
}

function alertsCard(){
  const on=alertsOn();
  let notify='';
  if('Notification' in window){
    if(Notification.permission==='granted')notify='<span class="muted">Notifications are on while this page is open in the background.</span>';
    else if(Notification.permission==='denied')notify='<span class="muted">Notifications are blocked in this browser’s settings.</span>';
    else notify='<button type="button" class="toggle" id="notifyBtn">Also notify me in the background</button>';
  }
  return `<section class="card"><p class="eyebrow">Score alerts · this device</p>
    <p class="muted">Pop-up banners for scores, kickoffs, finals and weekly winners.</p>
    <div class="setrow"><button type="button" class="toggle" id="alertsToggle" aria-pressed="${on}">${on?'Alerts on':'Alerts off'}</button>${on?notify:''}<button type="button" class="linkbtn" id="testAlert">Show a sample alert</button></div></section>`;
}

function renderFamily(app){
  let h='<section class="card"><p class="eyebrow">The five of you</p><form id="famForm">';
  players().forEach((p,i)=>{
    h+=`<div class="frow" style="--c:${esc(p.color)}"><span class="jersey pkj">${initial(p)}</span>
      <input name="n${i}" value="${esc(p.name)}" maxlength="16" aria-label="Name for player ${i+1}" autocomplete="off">
      <div class="sw" role="group" aria-label="Color for ${esc(p.name)}">${COLORS.map(c=>`<button type="button" style="--c:${c}" data-swatch="${i}" data-color="${c}" aria-pressed="${c===p.color}" aria-label="Color ${c}"></button>`).join('')}</div></div>`;
  });
  h+='<div style="margin-top:12px;display:flex;gap:12px;align-items:center"><button class="primary" type="submit">Save family</button><span class="muted">Needs the parent password. Everyone sees these names.</span></div></form></section>';
  h+=alertsCard();
  if(S.parent)h+=`<section class="card"><p class="eyebrow">Parent controls</p><p class="muted">A parent is signed in on this device. <button type="button" class="linkbtn" id="parentSignOut">Sign out</button></p></section>`;
  h+=`<details class="rules"><summary>How Sunday Picks works</summary><p class="muted">Pick who you are at the top of the Picks tab, then tap the team you think will win each game. You can change a pick until kickoff; then it locks and everyone’s picks show. Each week runs Sunday through the next Thursday, so the Thursday night game counts toward the week you pick on Sunday. Scores come from ESPN and update every minute during games while the page is open. When a week ends, 1st place (most correct picks) gets 3 points, 2nd gets 2 and 3rd gets 1. Ties on correct picks are broken by the closest guess of total points in the week’s last game. Most points at the end of the season wins.</p></details>`;
  app.innerHTML=h;
  S.draft=players().map(p=>({...p}));
}

/* ---- actions ---- */
async function writePickDoc(w,pid,doc,failMsg){
  const key='w'+w+'-'+pid;
  S.picks[key]=doc;render();
  try{await S.db.doc('picks/'+key).set(doc);maybeAutoLock();return true}
  catch(e){toast(failMsg);return false}
}
function savePick(g,team){
  const w=S.week,me=player(S.me),doc=pickDoc(w,me.id);
  const cur={...(doc.picks||{})};
  if(cur[g.id]===team)delete cur[g.id]; else cur[g.id]=team;
  writePickDoc(w,me.id,{...doc,week:w,player:me.id,picks:cur},'That pick didn’t save. Check your connection and tap it again.');
}
document.addEventListener('change',async(e)=>{
  const input=e.target.closest('[data-tb]');if(!input)return;
  const g=weekGames(S.week).find(x=>x.id===input.dataset.tb);if(!g)return;
  if(locked(g)){toast('The tiebreaker is locked.');render();return}
  const me=player(S.me),doc=pickDoc(S.week,me.id);
  const v=input.value===''?null:Math.max(0,Math.min(150,Math.round(Number(input.value))));
  if(await writePickDoc(S.week,me.id,{...doc,week:S.week,player:me.id,tb:v,tbAt:new Date().toISOString()},'Tiebreaker didn’t save. Try again.'))toast(v===null?'Tiebreaker cleared':'Tiebreaker saved: '+v+' points');
});

document.addEventListener('click',(e)=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){S.tab=tab.dataset.tab;S.results=false;store.set('tab',S.tab);render();window.scrollTo(0,0);return}
  const pk=e.target.closest('[data-picker]');
  if(pk){S.me=pk.dataset.picker;store.set('picker',S.me);render();return}
  if(e.target.closest('#resToggle')){S.results=!S.results;render();return}
  if(e.target.closest('#revealToggle')){S.revealAll=!S.revealAll;render();return}
  if(e.target.closest('#lockToggle')){
    const w=S.week;
    if(!weekLocked(w))setLock(w,true);
    else requireParent(`Enter the parent password to unlock Week ${w} picks.`,()=>setLock(w,false));
    return}
  if(e.target.closest('#alertsToggle')){store.set('alerts',alertsOn()?'off':'on');render();return}
  if(e.target.closest('#notifyBtn')){Notification.requestPermission().then(()=>render());return}
  if(e.target.closest('#testAlert')){sampleAlert();return}
  const al=e.target.closest('#alert');
  if(al){const id=al.dataset.game;nextAlert();if(id){S.tab='picks';store.set('tab','picks');render();const el=document.querySelector(`.team[data-game="${id}"]`);if(el)el.closest('.game').scrollIntoView({block:'center',behavior:'smooth'})}return}
  if(e.target.closest('#parentSignOut')){signOut(S.auth).then(()=>toast('Parent signed out on this device'));return}
  const sw=e.target.closest('[data-swatch]');
  if(sw){const i=+sw.dataset.swatch;S.draft[i].color=sw.dataset.color;sw.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===sw)));sw.closest('.frow').style.setProperty('--c',sw.dataset.color);return}
  const tb=e.target.closest('.team[data-game]');
  if(tb){const g=weekGames(S.week).find(x=>x.id===tb.dataset.game);if(!g)return;
    if(locked(g)){toast('Picks for this game are locked.');return}
    savePick(g,tb.dataset.team)}
});
document.addEventListener('submit',async(e)=>{
  if(e.target.id!=='famForm')return;e.preventDefault();
  const fd=new FormData(e.target);
  const next={players:S.draft.map((p,i)=>({id:p.id,name:(fd.get('n'+i)||'').trim().slice(0,16)||'Player '+(i+1),color:p.color}))};
  requireParent('Enter the parent password to change names and colors.',async()=>{
    const prev=S.family;S.family=next;
    try{await S.db.doc('config/family').set(next);toast('Family saved');S.tab='picks';store.set('tab','picks');render()}
    catch{S.family=prev;render();toast('Only a parent can change names and colors.')}
  });
});
$('#prev').onclick=()=>{if(S.week>1){S.week--;S.results=false;render()}};
$('#next').onclick=()=>{if(S.week<18){S.week++;S.results=false;render()}};

/* ---- data ---- */
// Firestore behind the small doc/collection surface the page was written against
function makeDb(fs){
  return {
    doc:(p)=>({
      set:(d)=>setDoc(doc(fs,p),d),
      onSnapshot:(next,err)=>onSnapshot(doc(fs,p),s=>next({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata}),err),
    }),
    collection:(p)=>({
      onSnapshot:(next,err)=>onSnapshot(collection(fs,p),s=>next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata}),err),
    }),
  };
}

const nfl={};
let lastFullLoad=0;
function applySchedule(){
  S.weeks=groupIntoPickWeeks(nfl);S.ready=true;S.updatedAt=new Date();S.scoreError=false;
  if(!S.week)S.week=currentWeek();
  render();maybeAutoLock();
}
async function loadAllWeeks(){
  const all=await Promise.all(Array.from({length:18},(_,i)=>fetchWeek(i+1)));
  all.forEach((games,i)=>nfl[i+1]=games);
  lastFullLoad=Date.now();
}
// NFL weeks with a game about to start, live, or recently kicked off without a final
function activeNflWeeks(){
  const now=Date.now(),out=[];
  for(const [w,games] of Object.entries(nfl)){
    if(games.some(g=>{const t=new Date(g.t).getTime();return !g.w&&!g.tbd&&now>=t-10*60e3&&now<=t+6*3600e3}))out.push(+w);
  }
  return out;
}
/* ---- score alerts ---- */
let lastSeen=null;
S.flash={};
function flashing(g,side){const f=S.flash[g.id];return !!f&&f.until>Date.now()&&(!side||f[side])}
function alertsOn(){return store.get('alerts')!=='off'}
function pickWeekOf(id){for(const [w,wk] of Object.entries(S.weeks))if(wk.games.some(g=>g.id===id))return +w;return null}
function scoreKind(pts){return pts>=6&&pts<=8?'Touchdown':pts===3?'Field goal':pts===2?'Two points':pts===1?'Extra point':'Score'}
function nameList(list){return list.map(p=>`<b style="color:inherit">${esc(p.name)}</b>`).join(', ')}

function detectEvents(){
  const now=new Map();
  for(const games of Object.values(nfl))for(const g of games)now.set(g.id,g);
  const before=lastSeen;lastSeen=new Map([...now].map(([id,g])=>[id,{as:g.as,hs:g.hs,st:g.st,w:g.w}]));
  if(!before)return;
  const shown=currentWeek(),events=[];
  for(const g of now.values()){
    const b=before.get(g.id);if(!b||pickWeekOf(g.id)!==shown)continue;
    const da=g.as-b.as,dh=g.hs-b.hs;
    if(da>0||dh>0)S.flash[g.id]={a:da>0,h:dh>0,until:Date.now()+3000};
    if(b.st==='pre'&&g.st==='in')events.push({kind:'kickoff',g});
    if(da>0)events.push({kind:'score',g,side:'a',pts:da});
    if(dh>0)events.push({kind:'score',g,side:'h',pts:dh});
    if(!b.w&&g.w){
      events.push({kind:'final',g});
      const sc=weekScore(shown);
      if(sc.complete&&sc.winner&&sc.last&&sc.last.id===g.id)events.push({kind:'week',w:shown,sc});
    }
  }
  if(events.length)setTimeout(()=>render(),3100);
  events.forEach(queueAlert);
}

const alertQueue=[];let alertShowing=false,alertTimer=null;
function queueAlert(ev){
  if(!alertsOn())return;
  alertQueue.push(ev);
  if(alertQueue.length>8)alertQueue.splice(0,alertQueue.length-8);
  systemNotify(ev);
  if(!alertShowing)nextAlert();
}
function alertView(ev){
  if(ev.kind==='week'){
    const r=ev.sc.winner;
    return {tc:r.p.color,tc2:'rgba(0,0,0,.25)',tx:'#fff',title:`Week ${ev.w} winner`,meta:'+3 points',
      score:`<span>${esc(r.p.name)}</span>`,people:ev.sc.rows.slice(0,3).map(x=>`<span>${PLACE_LABEL[x.place-1]} <b>${esc(x.p.name)}</b> +${x.pts}</span>`).join(''),
      plain:`${r.p.name} wins Week ${ev.w} with ${r.right} correct`,confetti:[r.p.color,'#ffffff','#E8641E']};
  }
  const g=ev.g,w=pickWeekOf(g.id);
  const team=ev.kind==='score'?g[ev.side]:ev.kind==='final'&&g.w&&g.w!=='TIE'?(g.w===g.a.ab?g.a:g.h):g.h;
  const title=ev.kind==='score'?`${scoreKind(ev.pts)} ${team.name}`:ev.kind==='final'?(g.w==='TIE'?'Final · tie':`Final · ${team.name} win`):'Kickoff';
  const meta=ev.kind==='final'?`${g.a.ab} @ ${g.h.ab}`:(g.d||`${g.a.ab} @ ${g.h.ab}`);
  const picks=players().map(p=>({p,st:pickState(g,picksFor(w,p.id)[g.id])}));
  const groups=ev.kind==='final'?[['Right','ok'],['Wrong','no']]:[['Winning','up'],['Losing','down'],['Tied','even']];
  const people=groups.map(([label,st])=>{const list=picks.filter(x=>x.st===st).map(x=>x.p);return list.length?`<span>${label}: ${nameList(list)}</span>`:''}).join('');
  const me=player(S.me),mineRight=ev.kind==='final'&&picks.some(x=>x.p.id===me.id&&x.st==='ok');
  return {tc:team.c,tc2:team.c2,tx:textOn(team.c),title,meta,game:g.id,logo:ev.kind==='kickoff'?'':team.logo,
    score:`<span class="${g.as<g.hs?'lo':''}">${esc(g.a.ab)} ${g.as}</span><span class="lo">–</span><span class="${g.hs<g.as?'lo':''}">${g.hs} ${esc(g.h.ab)}</span>`,
    people,plain:`${title}: ${g.a.ab} ${g.as}, ${g.h.ab} ${g.hs}`,confetti:mineRight?[team.c,team.c2,'#ffffff']:null};
}
function nextAlert(){
  clearTimeout(alertTimer);
  const el=$('#alert'),ev=alertQueue.shift();
  if(!ev){alertShowing=false;el.hidden=true;return}
  alertShowing=true;
  const v=alertView(ev);
  el.style.setProperty('--tc',v.tc);el.style.setProperty('--tc2',v.tc2);el.style.setProperty('--tx',v.tx);
  el.dataset.game=v.game||'';
  el.innerHTML=`<div class="al-head">${v.logo?`<img class="al-logo" src="${esc(v.logo)}" alt="">`:''}<span class="al-kind">${esc(v.title)}</span><span class="al-meta">${esc(v.meta)}</span></div><div class="al-score num">${v.score}</div>${v.people?`<div class="al-people">${v.people}</div>`:''}`;
  el.hidden=false;el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
  if(v.confetti)confetti(v.confetti);
  alertTimer=setTimeout(nextAlert,6000);
}
function systemNotify(ev){
  try{
    if(!document.hidden||!('Notification' in window)||Notification.permission!=='granted')return;
    const v=alertView(ev);
    new Notification('Sunday Picks',{body:v.plain,tag:v.game||('week'+ev.w)});
  }catch{}
}
function confetti(colors){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const bits=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*80,y:110,vx:(Math.random()-.5)*11,vy:-Math.random()*9-3,s:Math.random()*7+4,c:colors[Math.floor(Math.random()*colors.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let last=performance.now();
  requestAnimationFrame(function frame(t){
    const k=Math.min(40,t-last)/16;last=t;
    x.clearRect(0,0,W,H);let alive=false;
    for(const b of bits){b.vy+=.28*k;b.vx*=.99;b.x+=b.vx*k;b.y+=b.vy*k;b.a+=b.va*k;
      if(b.y<H+20)alive=true;
      x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillStyle=b.c;x.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);x.restore();}
    if(alive)requestAnimationFrame(frame);else c.remove();
  });
}
function sampleAlert(){
  const w=S.week||currentWeek(),gs=weekGames(w);
  const g=gs.find(x=>x.st==='in')||gs.find(x=>x.w&&x.w!=='TIE')||gs[0];
  if(!g){toast('No games to show yet.');return}
  const side=g.as>=g.hs?'a':'h';
  const was=alertsOn();store.set('alerts','on');
  queueAlert({kind:'score',g,side,pts:7});
  if(g.w&&g.w!=='TIE')queueAlert({kind:'final',g});
  if(!was)store.set('alerts','off');
}

let pollTimer=null;
async function refresh(){
  clearTimeout(pollTimer);
  const active=activeNflWeeks();
  try{
    if(!lastFullLoad||Date.now()-lastFullLoad>30*60e3)await loadAllWeeks();
    else for(const w of active)nfl[w]=await fetchWeek(w);
    applySchedule();
    detectEvents();
  }catch(e){S.ready=true;S.scoreError=true;render()}
  pollTimer=setTimeout(refresh,activeNflWeeks().length?30e3:10*60e3);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.updatedAt&&Date.now()-S.updatedAt>60e3)refresh()});

render();
if(!firebaseConfig||!firebaseConfig.projectId||firebaseConfig.projectId.startsWith('YOUR')){
  S.offline=true;render();
}else{
  const app=initializeApp(firebaseConfig);
  S.auth=getAuth(app);
  onAuthStateChanged(S.auth,(user)=>{S.parent=!!user;render()});
  const db=makeDb(getFirestore(app));
  S.db=db;
  db.doc('config/family').onSnapshot(s=>{if(s.exists){S.family=s.data();render()}},()=>{});
  db.collection('locks').onSnapshot(s=>{
    const next={};s.docs.forEach(d=>next[d.id]=d.data());S.locks=next;
    if(!s.metadata.fromCache)S.locksLoaded=true;render();maybeAutoLock();
  },()=>{});
  db.collection('picks').onSnapshot(s=>{
    const next={};s.docs.forEach(d=>next[d.id]=d.data());S.picks=next;
    if(!s.metadata.fromCache)S.picksLoaded=true;render();maybeAutoLock();
  },()=>toast('Live updates stopped. Reload the page to see new picks.'));
  refresh();
}
</script>
